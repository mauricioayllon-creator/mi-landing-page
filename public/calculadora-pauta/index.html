<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Calculadora de pauta: si a un negocio le conviene poner plata en anuncios, cuánto poner y qué arreglar primero.">
<meta name="robots" content="noindex">
<title>Calculadora de Pauta · Grow Business</title>
<link rel="icon" type="image/png" href="/grow-business-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>/* Dentro de Tu panel: sin el título repetido y en el mismo modo (claro o noche) que el panel; si lo cambias allá, cambia aquí. */(function(){try{if(window.self===window.top)return}catch(e){}var h=document.documentElement;h.classList.add("en-panel");function tema(){var t="noche";try{t=localStorage.getItem("gb-tema")||"noche"}catch(e){}var d=t==="noche"||(t==="auto"&&!!window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);h.setAttribute("data-theme",d?"dark":"light")}tema();addEventListener("storage",function(e){if(!e.key||e.key==="gb-tema")tema()})})();</script>
<link rel="stylesheet" href="/calculadora-pauta/estilo.css?v=3">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="marca">
      <a class="app-ico" href="/panel#calculadoras" title="Volver a tu panel" aria-label="Volver a tu panel"><img src="/grow-business-logo.png" alt=""></a>
      <div>
        <h1>Calculadora de Pauta</h1>
        <p id="subtitulo">¿Le conviene pautar, cuánto y qué arreglar primero?</p>
      </div>
    </div>
    <div class="acciones">
      <button type="button" class="btn-azul" data-accion="guia">Paso a paso</button>
      <button type="button" class="btn-g" data-accion="ejemplo">Ejemplo</button>
      <button type="button" class="btn-g" data-accion="nuevo">Nuevo</button>
      <button type="button" class="btn-g" data-accion="copiar">Copiar resumen</button>
    </div>
  </div>
</header>

<main class="app">
  <section class="col-datos" id="datos" aria-label="Datos del negocio"></section>
  <section class="col-panel" id="panel" aria-label="Resultado"></section>
</main>

<button type="button" class="barra-movil" id="barraMovil" data-abrir="resultado"></button>

<dialog class="hoja" id="hoja" aria-labelledby="hojaTitulo">
  <div class="hoja-cuerpo" id="hojaCuerpo"></div>
  <div class="aviso" id="avisoHoja" role="status" aria-live="polite"></div>
</dialog>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px">Esta calculadora necesita JavaScript para funcionar.</p></noscript>
<script src="/calculadora-pauta/formato.js?v=1"></script>
<script src="/calculadora-pauta/motor.js?v=1"></script>
<script src="/calculadora-pauta/campos.js?v=1"></script>
<script src="/calculadora-pauta/fichas-negocio.js?v=1"></script>
<script src="/calculadora-pauta/fichas-sistema.js?v=1"></script>
<script src="/calculadora-pauta/textos.js?v=1"></script>
<script src="/calculadora-pauta/pintar.js?v=1"></script>
<script src="/calculadora-pauta/hoja.js?v=1"></script>
<script src="/calculadora-pauta/app.js?v=1"></script>
</body>
</html>
