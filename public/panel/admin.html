<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#082e6e">
<title>Tus clientes · Grow Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  /* ---------- estructura ---------- */
  .app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
  .lado { position: sticky; top: 0; height: 100vh; overflow: auto; color: #fff; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px;
    background: radial-gradient(300px 260px at 0% 0%, rgba(92, 165, 255, .28), transparent 70%), linear-gradient(180deg, #0a3a86, #082e6e 40%, #051d47); }
  .lado-marca { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
  .logo-gb { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; background: #fff; color: var(--blue-2); font-family: var(--display); font-weight: 800; font-size: 19px; box-shadow: 0 6px 16px -6px rgba(0, 0, 0, .5); }
  .lado-marca b { display: block; font-size: 15px; }
  .lado-marca small { display: block; font-size: 12px; color: rgba(255, 255, 255, .6); font-weight: 600; }
  .nav-i { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 13px; color: rgba(255, 255, 255, .78); font-weight: 700; font-size: 14px; text-decoration: none; border: 0; background: none; cursor: pointer; text-align: left; width: 100%; transition: background .2s, color .2s; }
  .nav-i:hover { background: rgba(255, 255, 255, .08); color: #fff; }
  .nav-i.activo { background: rgba(255, 255, 255, .14); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
  .nav-i .cuenta { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--coral); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
  .lado-tit { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: rgba(255, 255, 255, .45); padding: 18px 12px 6px; }
  .cli-i { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 13px; color: rgba(255, 255, 255, .85); text-decoration: none; transition: background .2s; }
  .cli-i:hover { background: rgba(255, 255, 255, .08); }
  .cli-i.activo { background: rgba(255, 255, 255, .14); color: #fff; }
  .cli-i .avatar { width: 32px; height: 32px; border-radius: 10px; font-size: 12px; background: rgba(255, 255, 255, .14); }
  .cli-i > div:not(.avatar) { flex: 1; min-width: 0; }
  .cli-i b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cli-i .mini-barra { height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .14); margin-top: 5px; overflow: hidden; }
  .cli-i .mini-barra i { display: block; height: 100%; background: var(--lima); border-radius: 99px; }
  .cli-i .alarma { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 3px rgba(229, 72, 77, .25); flex: none; }
  .lado .esp { flex: 1; }
  .app > div { min-width: 0; }
  .principal { min-width: 0; padding: 28px 32px 120px; }
  .ancho { max-width: 1060px; margin: 0 auto; }
  .movil-top, .movil-nav { display: none; }

  /* ---------- encabezados ---------- */
  .cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .cab h1 { font-family: var(--display); font-size: 32px; line-height: 1.05; letter-spacing: -.03em; }
  .cab p { margin-top: 6px; color: var(--ink-2); font-weight: 600; }
  .cab .acc { display: flex; gap: 8px; flex-wrap: wrap; }
  .sec-tit { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--ink-2); text-transform: uppercase; letter-spacing: .09em; margin: 30px 0 12px; }
  .volver { margin-bottom: 14px; }

  /* ---------- entrar ---------- */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 20px;
    background: radial-gradient(700px 420px at 100% 0%, rgba(92, 165, 255, .45), transparent 60%), radial-gradient(500px 360px at 0% 100%, rgba(49, 217, 109, .2), transparent 60%), linear-gradient(160deg, #1a6fe0, #082e6e 70%, #051d47); }
  .login-card { width: 100%; max-width: 400px; padding: 34px 28px; border-radius: 28px; background: #fff; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .55); text-align: center; }
  .login-card .logo-gb { width: 60px; height: 60px; border-radius: 19px; font-size: 30px; margin: 0 auto 18px; background: linear-gradient(135deg, var(--blue), var(--navy)); color: #fff; }
  .login-card h1 { font-family: var(--display); font-size: 28px; letter-spacing: -.03em; margin-bottom: 6px; }
  .login-card p { color: var(--ink-2); margin-bottom: 22px; }
  .login-card .etq { text-align: left; }
  .login-card .btn { width: 100%; margin-top: 14px; min-height: 52px; }
  .msg-err { margin-top: 12px; color: var(--coral-ink); font-weight: 700; font-size: 14px; }

  /* ---------- hoy ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi { padding: 16px; }
  .kpi .i { color: var(--blue); }
  .kpi b { display: block; font-family: var(--display); font-size: 30px; line-height: 1.05; letter-spacing: -.03em; margin-top: 10px; }
  .kpi > span { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin-top: 3px; }
  .kpi[data-accion] { cursor: pointer; transition: transform .15s var(--ease), box-shadow .2s; }
  .kpi[data-accion]:hover { box-shadow: var(--sh-2); }
  .kpi[data-accion]:active { transform: scale(.98); }
  .kpi.rojo .i, .kpi.rojo b { color: var(--coral-ink); }
  .kpi.verde .i { color: var(--lima-2); }
  .primero { position: relative; overflow: hidden; display: flex; gap: 16px; align-items: center; padding: 20px; border-radius: var(--r-lg); color: #fff; margin-top: 14px; box-shadow: var(--sh-2);
    background: radial-gradient(380px 220px at 100% 0%, rgba(92, 165, 255, .45), transparent 65%), linear-gradient(135deg, #0b4bb0, #082e6e 70%); }
  .primero.n3 { background: radial-gradient(380px 220px at 100% 0%, rgba(255, 140, 140, .35), transparent 65%), linear-gradient(135deg, #b3222a, #7a1219 80%); }
  .primero .ico-g { width: 54px; height: 54px; border-radius: 17px; display: grid; place-items: center; flex: none; background: rgba(255, 255, 255, .15); }
  .primero small { display: block; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: rgba(255, 255, 255, .7); margin-bottom: 3px; }
  .primero p { font-family: var(--display); font-size: 20px; line-height: 1.2; letter-spacing: -.015em; }
  .primero .quien { display: block; margin-top: 4px; font-size: 13.5px; font-weight: 700; color: rgba(255, 255, 255, .78); font-family: "Plus Jakarta Sans", system-ui, sans-serif; letter-spacing: 0; }
  .primero .txt { flex: 1; min-width: 0; }
  .primero .acc { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn.blanco { border: 0; background: #fff; color: var(--navy); }
  .btn.vidrio { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); color: #fff; }
  .alertas { display: grid; gap: 8px; }
  .alerta { display: flex; gap: 12px; align-items: center; padding: 12px 12px 12px 14px; border-radius: 18px; background: #fff; border: 1px solid var(--line); box-shadow: var(--sh-1); }
  .alerta .a-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--blue-soft); color: var(--blue); }
  .alerta.n3 .a-ico { background: var(--coral-soft); color: var(--coral-ink); }
  .alerta.n2 .a-ico { background: var(--naranja-soft); color: var(--naranja-ink); }
  .alerta.n1 .a-ico { background: var(--amarillo-soft); color: var(--amarillo-ink); }
  .alerta .txt { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; line-height: 1.35; }
  .alerta .txt small { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
  .alerta .acc { display: flex; gap: 6px; flex: none; }
  .todo-bien { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 18px; background: var(--lima-soft); color: var(--lima-2); font-weight: 800; }
  .tarjetas { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .tarjeta { padding: 18px; display: flex; flex-direction: column; gap: 14px; text-decoration: none; color: inherit; transition: transform .25s var(--ease), box-shadow .25s; }
  .tarjeta:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
  .t-top { display: flex; gap: 12px; align-items: center; }
  .t-top .avatar { width: 46px; height: 46px; font-size: 16px; }
  .t-top h3 { font-size: 16px; line-height: 1.2; }
  .t-top .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .t-medio { display: flex; gap: 14px; align-items: center; }
  .t-anillo { position: relative; width: 62px; height: 62px; flex: none; }
  .t-anillo b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 15px; }
  .t-paso small { display: block; font-size: 11.5px; font-weight: 800; color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; }
  .t-paso b { display: block; font-size: 14.5px; line-height: 1.3; }
  .t-paso > span { display: block; font-size: 12.5px; color: var(--ink-2); font-weight: 600; margin-top: 2px; }
  .hechos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .hecho { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
  .hecho .i { color: var(--ink-3); }
  .hecho b { display: block; color: var(--ink); }
  .hecho.mal { background: var(--coral-soft); color: var(--coral-ink); }
  .hecho.mal .i, .hecho.mal b { color: var(--coral-ink); }
  .semana { padding: 6px 16px; }
  .dia { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-top: 1px solid var(--line-2); }
  .dia:first-child { border-top: 0; }
  .dia-cab b { display: block; font-family: var(--display); font-size: 17px; letter-spacing: -.02em; }
  .dia-cab span { font-size: 12px; font-weight: 700; color: var(--ink-3); }
  .dia-items { display: grid; gap: 6px; }
  .ev { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 13px; text-decoration: none; color: inherit; background: var(--surface-2); transition: background .2s; }
  .ev:hover { background: var(--blue-soft); }
  .ev-ico { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; flex: none; background: #fff; color: var(--blue); box-shadow: var(--sh-1); }
  .ev.cobro .ev-ico { color: var(--lima-2); }
  .ev.tarea .ev-ico { color: var(--amber-ink); }
  .ev-txt { min-width: 0; }
  .ev-txt b { display: block; font-size: 13.5px; line-height: 1.3; }
  .ev-txt small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .calif { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 16px; border-radius: 20px; margin-bottom: 14px; background: linear-gradient(135deg, #0b4bb0, #082e6e); color: #fff; }
  .calif b.nota { font-family: var(--display); font-size: 40px; line-height: 1; color: var(--lima); }
  .calif b.nota small { font-size: 18px; color: rgba(255, 255, 255, .6); }
  .calif .txt { flex: 1; min-width: 200px; }
  .calif .txt small { display: block; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: rgba(255, 255, 255, .7); }
  .calif .txt p { font-size: 14.5px; font-weight: 600; margin-top: 3px; }
  .num-ed .antes { display: flex; align-items: center; gap: 6px; margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; font-weight: 800; color: var(--ink-3); }
  .num-ed .antes input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 13px; font-weight: 800; color: var(--ink-2); }
  .num-ed .antes input:focus { background: var(--surface-2); border-radius: 6px; }
  .nuevo-t { border: 2px dashed #c8d3e6; border-radius: var(--r-lg); display: grid; place-items: center; min-height: 220px; text-decoration: none; color: var(--ink-2); font-weight: 800; transition: border-color .2s, color .2s, background .2s; }
  .nuevo-t:hover { border-color: var(--blue); color: var(--blue); background: #fff; }
  .nuevo-t .mas { width: 54px; height: 54px; border-radius: 17px; display: grid; place-items: center; margin: 0 auto 10px; background: var(--blue); color: #fff; box-shadow: var(--sh-azul); }

  /* ---------- ficha ---------- */
  .ficha-hero { position: relative; overflow: hidden; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; padding: 22px; border-radius: var(--r-xl); color: #fff; box-shadow: var(--sh-2);
    background: radial-gradient(500px 300px at 100% -10%, rgba(92, 165, 255, .45), transparent 60%), radial-gradient(300px 200px at 0% 120%, rgba(49, 217, 109, .2), transparent 60%), linear-gradient(140deg, #1a6fe0, #0b4bb0 45%, #082e6e); }
  .ficha-hero .avatar { width: 64px; height: 64px; border-radius: 20px; font-size: 22px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .25); }
  .ficha-hero .nombre { flex: 1; min-width: 200px; }
  .ficha-hero h1 { font-family: var(--display); font-size: 29px; line-height: 1.05; letter-spacing: -.03em; }
  .ficha-hero .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .ficha-hero .estado-g { display: flex; align-items: center; gap: 14px; }
  .ficha-hero .t-anillo { width: 78px; height: 78px; }
  .ficha-hero .t-anillo b { font-size: 18px; }
  .ficha-hero .estado-g small { display: block; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--lima); }
  .ficha-hero .estado-g p { font-family: var(--display); font-size: 18px; line-height: 1.2; max-width: 240px; }
  .ficha-hero .estado-g span { display: block; font-size: 12.5px; color: rgba(255, 255, 255, .75); font-weight: 700; margin-top: 2px; }
  .datos-fila { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  .dato { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 16px; background: #fff; border: 1px solid var(--line); }
  .dato .i { color: var(--blue); }
  .dato small { display: block; font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
  .dato b { display: block; font-size: 13.5px; }
  .dato.mal { background: var(--coral-soft); border-color: #f6c6c9; }
  .dato.mal .i, .dato.mal b { color: var(--coral-ink); }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 0; }
  .sugerencia { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 16px; border-radius: 20px; margin-top: 14px; background: linear-gradient(135deg, var(--naranja-soft), #fff); border: 1.5px solid #fbc9a0; }
  .sugerencia.n3 { background: linear-gradient(135deg, #fff1f1, #fff); border-color: #f6c1c3; }
  .sugerencia.n1 { background: linear-gradient(135deg, var(--amarillo-soft), #fff); border-color: #f3dc85; }
  .sugerencia .s-ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--naranja); color: #fff; }
  .sugerencia.n3 .s-ico { background: var(--coral); }
  .sugerencia.n1 .s-ico { background: var(--amarillo); color: #3a2a00; }
  .sugerencia small { display: block; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2); }
  .sugerencia p { font-weight: 800; font-size: 15px; line-height: 1.35; }
  .sugerencia .txt { flex: 1; min-width: 200px; }
  .sugerencia .acc { display: flex; gap: 6px; }
  .sugerencia .mas-txt { font-size: 12.5px; color: var(--ink-2); font-weight: 700; margin-top: 3px; }
  .pestanas { position: sticky; top: 0; z-index: 30; margin: 18px -4px 16px; padding: 10px 4px; background: rgba(242, 245, 251, .9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pestanas .seg { overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .pestanas .seg::-webkit-scrollbar { display: none; }
  .pestanas .seg button { padding: 9px 13px; }
  .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--coral); color: #fff; font-size: 11px; display: inline-grid; place-items: center; }
  .guardado { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 800; white-space: nowrap; background: var(--lima-soft); color: var(--lima-2); flex: none; margin-left: auto; }
  .guardado.cambios, .guardado.guardando { background: var(--blue-soft); color: var(--blue-2); }
  .guardado.error { background: var(--coral-soft); color: var(--coral-ink); cursor: pointer; }
  .guardado.local { background: var(--amber-soft); color: var(--amber-ink); }
  .pend-nota { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; padding: 10px 14px; border-radius: 14px; background: var(--amber-soft); color: var(--amber-ink); font-size: 13.5px; font-weight: 700; }
  .pend-nota > span { flex: 1; min-width: 200px; }
  .guardado.guardando .i { animation: gira 1s linear infinite; }

  /* ---------- el motor en tu panel ---------- */
  .ficha-hero .motor-h { flex-basis: 100%; padding: 14px 14px 12px; border-radius: 20px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); }
  .motor-h .mh-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; font-weight: 700; color: rgba(255, 255, 255, .85); }
  .motor-h .mh-top b { font-family: var(--display); font-size: 22px; color: #fff; letter-spacing: -.02em; }
  .motor-h .mh-top .esp { flex: 1; }
  .motor-h .mh-freno { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: var(--amber); color: #3a2002; font-weight: 800; font-size: 12.5px; }
  .motor-h .mh-freno.yo { background: #ff8a8e; color: #3d0508; }
  .motor-h .mh-ok { display: inline-flex; align-items: center; gap: 6px; color: var(--lima); font-weight: 800; }
  .motor-card { padding: 18px; margin-bottom: 18px; }
  .mc-top { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .mc-pct b { display: block; font-family: var(--display); font-size: 40px; line-height: .9; letter-spacing: -.04em; color: var(--navy); }
  .mc-pct b small { font-size: 20px; color: var(--ink-3); }
  .mc-pct span { display: block; font-size: 12.5px; font-weight: 800; color: var(--ink-2); margin-top: 4px; }
  .mc-obj { flex: 1; min-width: 220px; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: linear-gradient(135deg, var(--blue-2), var(--navy)); color: #fff; }
  .mc-obj .i { color: var(--lima); margin-top: 2px; }
  .mc-obj small { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: rgba(255, 255, 255, .65); }
  .mc-obj span { font-size: 14px; font-weight: 700; line-height: 1.35; }
  .mc-obj a { color: var(--lima); }
  .frenos { display: grid; gap: 8px; margin-top: 14px; }
  .freno { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 11px 12px; border-radius: 16px; background: var(--naranja-soft); border: 1px solid #fbc9a0; }
  .freno.n3 { background: #fff1f1; border-color: #f6c1c3; }
  .freno.n1 { background: var(--amarillo-soft); border-color: #f3dc85; }
  .freno .f-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--naranja); color: #fff; }
  .freno.n3 .f-ico { background: var(--coral); }
  .freno.n1 .f-ico { background: var(--amarillo); color: #3a2a00; }
  .freno .txt { flex: 1; min-width: 180px; }
  .freno .txt small { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
  .freno .txt b { display: block; font-size: 14.5px; line-height: 1.3; }

  .sis-hero { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 22px; border-radius: var(--r-xl); color: #fff; box-shadow: var(--sh-2);
    background: radial-gradient(500px 300px at 100% -10%, rgba(160, 120, 255, .5), transparent 60%), linear-gradient(140deg, #3a2ab0, #1c2a8c 50%, #082e6e); }

  .sis-cuerpo ul, .sis-cuerpo ol, .sis-paso ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; color: var(--ink-2); font-weight: 600; }

  .sis-caja p, .r-campo, .aviso-ed, .dice p, .g-que { overflow-wrap: anywhere; }

  /* ---------- los colores de las capas ---------- */
  :root { --naranja: #f76808; --naranja-ink: #a84300; --naranja-soft: #fff0e2; --amarillo: #f2b100; --amarillo-ink: #7a5700; --amarillo-soft: #fff7d1; --hecho: #64748b; --hecho-soft: #e9edf3; }

  /* ---------- textos: lo principal a la vista y el resto con «···» ---------- */

  .tx.abierto > .tx-resto { display: inline; }
  .tx-b.abierto > .tx-resto { display: block; margin-top: 8px; }

  body.textos-abiertos .tx-b > .tx-resto { display: block; margin-top: 8px; }
  body.textos-abiertos .tres { display: none; }
  .tres { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 2.5px; height: 20px; min-width: 30px; padding: 0 7px; margin-left: 5px; vertical-align: 1px; border: 0; border-radius: 99px; background: #e6ecf5; cursor: pointer; transition: background .15s; flex: none; }

  .primero .tres i, .p-hero .tres i, .sis-hero .tres i, .gar .tres i, .guia-hero .tres i, .ficha-hero .tres i, .mc-obj .tres i { background: #fff; }
  .tx-b > .tx-resto { font-weight: 600; color: var(--ink-2); line-height: 1.5; }
  .gps-cab .tx-resto, .gps-cab + .tx-resto { text-transform: none; letter-spacing: 0; }

  /* ---------- la barra de capas (abajo a la izquierda) ---------- */
  .capas { position: fixed; z-index: 44; left: 276px; bottom: 18px; display: flex; align-items: center; gap: 3px; padding: 5px; border-radius: 99px; background: rgba(255, 255, 255, .94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: 0 16px 36px -14px rgba(11, 21, 48, .38); max-width: calc(100vw - 296px); overflow-x: auto; scrollbar-width: none; animation: aparece .4s var(--ease) both; }

  .k-hecho > .punto { background: var(--hecho); }
  .capa.activa { background: var(--navy); color: #fff; }

  /* En la ficha de un cliente: cada paso, video y pago con el color de su urgencia (una raya a la izquierda) */
  .paso-ed::before, .fila-ed::before { content: ""; position: absolute; left: -1px; top: 18px; bottom: 18px; width: 4px; border-radius: 0 4px 4px 0; }

    if (ds.pseg) { var ps = deCol("prospectos", S.pid); if (ps) { ps.seg = ps.seg || {}; ps.seg[ds.pseg] = t.checked; guardarItemLuego("prospectos", ps.id, 300); } return; }
    if (ds.pcheck) { var pk = deCol("prospectos", S.pid); if (pk) { pk[ds.pcheck] = t.checked; guardarItemLuego("prospectos", pk.id, 300); } return; }
    if (ds.pcampo) { if (t.type === "date" || t.type === "time" || t.tagName === "SELECT") campoProspecto(t); return; }
    if (ds.acampo) { if (t.type === "date") ponerAgencia(ds.acampo, t.value); return; }
    if (ds.mplan) {
      var mp = ds.mplan.split("|"), am2 = ag(), sm = am2.semanas[mp[0]] || (am2.semanas[mp[0]] = { hechos: {}, ganchos: [], cuerpo: "", check: {} });
      // Lo que no tocaste queda como lo sugerido: así esa semana pasa a «planeada»
      var w0 = GB.planSemanas(datosMesa(), hoy(), SIS.contenido.semanasPlan).find(function (w) { return w.wk === mp[0]; }) || {};
      sm.plan = { angulo: (sm.plan && sm.plan.angulo) || w0.angulo || "", formato: (sm.plan && sm.plan.formato) || w0.formato || "" };
      sm.plan[mp[1]] = t.value; guardarAgenciaLuego(); repintar();
      return;
    }
    if (ds.mestado) {
      var me = ds.mestado.split("|"), am3 = ag(), campoE = me[0] === "angulos" ? "angulosEstado" : "formatosEstado";
      am3[campoE] = Object.assign({}, am3[campoE]); if (t.value) am3[campoE][me[1]] = t.value; else delete am3[campoE][me[1]];
      guardarAgenciaLuego(); repintar();
      return;
    }
    if (ds.mcampo) { if (t.type === "date" || t.tagName === "SELECT") { var mc2 = ds.mcampo.split("|"); ponerCampana(mc2[0], mc2[1], t.value); if (mc2[1] === "estado" || mc2[1] === "para") repintar(); } return; }
    if (ds.cfecha) { ponerVideoCampo(ds.cfecha, "fechaPub", t.value); repintar(); return; }
    // Lo gastado y los números de una campaña: al salir del campo se vuelven a hacer sus cuentas
    if (ds.mgasto || ds.mnum) { repintar(); return; }
    if (ds.num || ds.rcampo || ds.ctexto || ds.cprevia || ds.cpub) return;
    if (ds.gar && S.det) {
      // Su número cambió: se vuelve a dibujar solo la tarjeta de la garantía
      var card = t.closest(".gar"), tmp = document.createElement("div");
      tmp.innerHTML = garantiaHTML(S.det.proyecto);
      if (card && tmp.firstChild) { card.replaceWith(tmp.firstChild); aplicarCapas(); }
      return;
    }
    if (ds.cupon != null && S.det) {
      var lk = GB.leerLinkCupon(t.value);
      if (!lk) { if (t.value.trim()) toast("Ese link no es del panel de una tienda: tiene que tener ?n=…&tienda=…", true); return; }
      S.det.proyecto.interno = S.det.proyecto.interno || { cupon: { n: "", t: "" }, check: {}, notas: "" };
      S.det.proyecto.interno.cupon = lk;
      cambio(); repintarTab(); toast("Conectado a su cupón: «" + lk.n + "»");
      return;
    }
    if (t.closest && t.closest("#f-nuevo")) { pintarPrevio(); return; }
    if (!S.det || !t.dataset || !t.dataset.campo) return;
    if (t.tagName !== "SELECT" && t.type !== "date") return;
    // Si mueves la fecha del primer video, el saldo atado a esa fecha se mueve con ella
    var partes = t.dataset.campo.split("|"), paso = partes[0] === "pasos" && partes[2] === "fecha" ? itemDe("pasos", partes[1]) : null;
    var viejo = paso && /primer video/i.test(paso.nombre) ? paso.fecha : "";
    ponerCampo(t.dataset.campo, t.value);
    if (viejo && t.value && t.value !== viejo) {
      var movidos = S.det.proyecto.pagos.filter(function (x) { return x.estado !== "pagado" && x.vence === viejo; });
      movidos.forEach(function (x) { x.vence = t.value; });
      if (movidos.length) toast("El saldo atado al primer video ahora vence el " + GB.diaCorto(t.value));
    }
    cambio();
    // Las fechas y "qué paso mueve" cambian el motor: se vuelve a dibujar
    if (/^pasos\||\|(fecha|vence|paso)$/.test(t.dataset.campo) || t.dataset.campo === "inicio" || t.dataset.campo === "fechaClave") pintarCliente();
  });
  document.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (ev.target.id === "f-entrar") entrar(ev.target);
    if (ev.target.id === "f-nuevo") crearCliente(ev.target);
    if (ev.target.id === "f-ajustes") guardarAjustes(ev.target);
    if (ev.target.id === "f-anotar") guardarAnotar(ev.target);
    if (ev.target.id === "f-lead") guardarLead(ev.target);
    if (ev.target.id === "f-idea") guardarIdea(ev.target, $("id-texto").value, S.idea);
    if (ev.target.id === "f-libreta") guardarIdea(ev.target, $("lb-texto").value, { cliente: $("lb-para").value });
    if (ev.target.id === "f-mevoy") guardarMeVoy(ev.target);
    if (ev.target.id === "f-idea-r") guardarIdeaRapida(ev.target);
    if (ev.target.id === "f-edicion") guardarEdicion(ev.target);
    if (ev.target.id === "f-barrida") guardarBarrida(ev.target);
    if (ev.target.id === "f-paraclaude") guardarParaClaude(ev.target);
    if (ev.target.id === "f-otarea") guardarTareaObj();
    if (ev.target.id === "f-ganchos") { var imp = GB.importarGanchos($("gc-texto").value); if (!imp.length) toast("No encontré ganchos en lo que pegaste", true); else { cerrarHoja(); cargarGanchos(imp).catch(falloRed); } }
  });

  // Al volver a la pestaña (o cada 2 minutos si la tienes abierta), trae lo que respondieron tus clientes
  var ultimaCarga = Date.now();
  function refrescarSiToca() {
    if (!S.clave || !S.datos || document.visibilityState !== "visible" || $("velo")) return;
    if (Date.now() - ultimaCarga < 60000) return;
    var foco = document.activeElement;
    if (foco && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName)) return;
    if (hayPendientes()) return;
    ultimaCarga = Date.now();
    cargarLista().then(function () {
      S.sinAnim = true;
      if (S.ruta === "cliente" && S.det && !sucio()) {
        var c = cliente(S.det.id);
        if (c) { S.det.proyecto = copia(c.proyecto); S.det.estado = c.estado; S.det.logo = c.logo || ""; S.det.rev = c.rev; shell(); pintarCliente(); }
      } else if (["inicio", "ventas", "marketing", "contenido", "prospecto", "clientes", "agencia", "objetivos", "libreta", "constancia"].indexOf(S.ruta) >= 0) repintar();
      else shell();
      S.sinAnim = false;
    }).catch(function () {});
  }
  document.addEventListener("visibilitychange", refrescarSiToca);
  setInterval(refrescarSiToca, 120000);

  if (!location.hash) history.replaceState(null, "", "#/inicio");
  S.capas = leerCapas(); S.capasFecha = S.capas.length ? hoy() : "";
  S.abiertoMs = Date.now();
  document.addEventListener("toggle", function (ev) { if (ev.target && ev.target.id === "ver-todo") guardarLocal("gb-vertodo", ev.target.open ? hoy() : null); }, true);
  if (leerLocal("gb_textos") === "1") document.body.classList.add("textos-abiertos");
  ruta();
})();
</script>
</body>
</html>
