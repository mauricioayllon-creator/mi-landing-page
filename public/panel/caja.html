    equipo:suma(s.equipo,pendiente('equipo')),servicios:suma(s.servicios,pendiente('servicios')),casa:suma(s.casa,pendiente('casa')),pautaPlan:planBs};
  var cuidar=a.pautaClientes+a.boveda+a.equipo+a.servicios+a.casa+a.pautaPlan;
  var hay=n(s.hay),colchon=on('colchon')?n(s.colchon):0,queda=hay-cuidar,libre=queda-colchon;
  var cobros=cl.filter(function(x){return x.deben>0&&x.c.fecha}).map(function(x){return {nombre:x.c.nombre,fecha:x.c.fecha,monto:x.deben,neto:x.netoPorCobrar,atrasado:x.c.fecha<hoy}}).sort(function(p,q){return p.fecha<q.fecha?-1:p.fecha>q.fecha?1:0});
  var porCobrar=suma(cl,function(x){return x.deben});
  function veredicto(need){
    if(libre>=need)return {k:'hoy',despues:libre-need};
    var acu=libre;
    for(var i=0;i<cobros.length;i++){acu+=cobros[i].neto;if(acu>=need)return {k:'fecha',cobro:cobros[i]}}
    if(queda>=need)return {k:'colchon',usa:need-Math.max(libre,0)};
    return {k:'no',falta:need-acu};
  }
  var conVenta=cl.filter(function(x){return x.total>0});
  var delMes=conVenta.filter(function(x){return (x.c.cierre||'').slice(0,7)===mes});
  var base=delMes.length?delMes:conVenta;
  var ticket=base.length?suma(base,function(x){return x.servTotal})/base.length:0;
  var netoCliente=ticket*(1-b);
  var usados=0;
  var compras=s.compras.map(function(it){
    var p=n(it.precio);
    if(!p)return {it:it,v:{k:'sin'}};
    var v=veredicto(usados+p);
    if(v.k==='hoy'||v.k==='fecha')usados+=p;
    if(v.k==='no'&&netoCliente>0)v.clientes=Math.ceil(v.falta/netoCliente);
    return {it:it,v:v};
  });
  var activos=suma(s.clientes,function(c){return c.terminado?0:(c.consultoria?.5:1)});
  var pm=s.pauta[mes]||{},usdGast=n(pm.tiktok)+n(pm.meta),bsGast=usdGast*tc;
  var nuevos=delMes.length,servMes=suma(delMes,function(x){return x.servTotal});
  var totEquipo=suma(s.equipo,completo('equipo')),totServ=suma(s.servicios,completo('servicios')),totCasa=suma(s.casa,completo('casa'));
  var cacPauta=nuevos?bsGast/nuevos:null,cacTotal=nuevos?(bsGast+totServ)/nuevos:null;
  var entrega=activos?totEquipo/activos:0,dejaCliente=ticket-entrega;
  var veces=cacTotal?dejaCliente/cacTotal:null,margenCliente=ticket?dejaCliente/ticket:null;
  var ganancia=servMes-bsGast-planBs-totEquipo-totServ,margen=servMes?ganancia/servMes:null;
  var bovMes=suma(delMes,function(x){return x.servTotal*x.bc}),sobra=ganancia-bovMes-totCasa;
  var faltanCl=sobra<0&&netoCliente>0?Math.ceil(-sobra/netoCliente):0;
  var bovAguanta=servMes?Math.max(0,Math.min(1,(ganancia-totCasa)/servMes)):null;
  var techo=cacPauta!==null?n(s.cupos)*cacPauta*1.2:null;
  var quedaTecho=techo!==null?Math.max(0,techo-bsGast):null;
  var garantias=suma(cl,function(x){return x.c.terminado?0:n(x.c.garantia)});
  var faltan=s.servicios.concat(s.equipo,s.casa).filter(function(i){return i.monto===null||i.monto===''||i.monto===undefined}).length+(s.tc?0:1)+(s.hay===null?1:0);
  return {mes:mes,tc:tc,b:b,cl:cl,a:a,cuidar:cuidar,hay:hay,colchon:colchon,queda:queda,libre:libre,cobros:cobros,porCobrar:porCobrar,servFalta:suma(cl,function(x){return x.servFalta}),pautaFalta:suma(cl,function(x){return x.pautaFalta}),
    netoCobros:suma(cobros,function(x){return x.neto}),vendido:suma(cl,function(x){return x.total}),entro:suma(cl,function(x){return x.pago}),
    veredicto:veredicto,compras:compras,netoCliente:netoCliente,ticket:ticket,activos:activos,cupos:n(s.cupos),usdGast:usdGast,bsGast:bsGast,nuevos:nuevos,servMes:servMes,
    totEquipo:totEquipo,totServ:totServ,totCasa:totCasa,cacPauta:cacPauta,cacTotal:cacTotal,dejaCliente:dejaCliente,veces:veces,margenCliente:margenCliente,
    ganancia:ganancia,margen:margen,bovMes:bovMes,sobra:sobra,faltanCl:faltanCl,bovAguanta:bovAguanta,techo:techo,quedaTecho:quedaTecho,planUSD:planUSD,planBs:planBs,
    delMes:delMes,entrega:entrega,servCobrado:servCobrado,crudo:crudo,planCrudo:planCrudo,bPct:bPct,on:on,pasado:n(s.bovedaPasado),
    garantias:garantias,bovedaTotal:n(s.bovedaPasado)+a.boveda,faltan:faltan,pm:pm};
}
/* FIN LOGICA */
</script>

<script>
/* El libro: cada movimiento del banco y del efectivo. Es la base de toda la Caja: lo que hay se calcula desde el punto de partida y esta lista.
   Tres tipos: Entró (verde), Salió (rojo) e Inversión (amarillo: sale igual que un gasto, pero cuenta como lo que invertimos para crecer). */
function signo(m){return m.t==='in'?1:-1}
function libro(){
  var ini=S.ini||{},b=n(ini.banco),e=n(ini.efectivo);
  (S.movs||[]).forEach(function(m){if(m.off)return;var v=n(m.m)*signo(m);if(m.donde==='efectivo')e+=v;else b+=v});
  return {banco:b,efectivo:e,total:b+e};
}
function sumaCli(id){return (S.movs||[]).reduce(function(t,m){return t+(!m.off&&m.t==='in'&&m.cli===id?n(m.m):0)},0)}
/* Lo de antes de las inversiones: los pagos a la tarjeta quedaron como «Salió». Pasan a Inversión una sola vez. */
function migrar(){
  (S.movs||[]).forEach(function(m){if(m.tipo==='publi'){if(m.t==='out')m.t='inv';m.cat='publi';delete m.tipo}});
}
function sync(){
  if(!S.ini)return;
  S.movs=S.movs||[];migrar();
  S.clientes.forEach(function(c){if(c.pagoAntes===undefined||c.pagoAntes===null)c.pagoAntes=n(c.pago)-sumaCli(c.id);c.pago=n(c.pagoAntes)+sumaCli(c.id)});
  var l=libro();S.hay=l.total;S.banco=l.banco;S.efectivo=l.efectivo;
}
function efecto(m,sg){
  var e=m.ef;if(!e)return;var v=n(m.m)*sg,c;
  if(e.k==='gastada'){c=mapa('clientes',e.id);if(c)c.gastada=n(c.gastada)+v}
  else if(e.k==='item'){S.pagos[e.mes]=S.pagos[e.mes]||{};S.pagos[e.mes][e.id]=n(S.pagos[e.mes][e.id])+(e.usd&&e.tc?v/e.tc:v)}
  else if(e.k==='pauta'){S.pauta[e.mes]=S.pauta[e.mes]||{};if(e.tc)S.pauta[e.mes].tiktok=n(S.pauta[e.mes].tiktok)+v/e.tc}
}
var INV=[['tarjeta','Publicidad (tarjeta en dólares)','pago a la tarjeta en dólares'],['herramienta','Equipo de trabajo','celular, compu, cámara…'],['otro','Otra inversión','']];
function armarMov(t,donde,sel,m,f,txt,nota,usd){
  f=f||hoyISO();var M=f.slice(0,7),tc=n(S.tc),o={t:t,donde:donde==='efectivo'?'efectivo':'banco',m:m,f:f},pz=String(sel||'otro|').split('|');
  if(nota)o.nota=nota;
  if(pz[0]==='tarjeta'&&t!=='in')t=o.t='inv';
  if(t==='inv'){
    if(pz[0]==='tarjeta'){o.q='Publicidad (tarjeta en dólares)';o.cat='publi';if(usd)o.usd=usd}
    else if(pz[0]==='herramienta'){o.q=txt||'Equipo de trabajo';o.cat='equipo'}
    else o.q=txt||'Otra inversión';
    return o;
  }
  if(t==='in'){if(sel&&sel!=='otro'){var k=mapa('clientes',sel);o.cli=sel;o.q=k?k.nombre:'Cliente'}else o.q=txt||'Otra entrada';return o}
  if(pz[0]==='pauta'){o.q='Nuestra publicidad';o.ef={k:'pauta',mes:M,tc:tc}}
  else if(pz[0]==='pcli'){var c=mapa('clientes',pz[1]);o.q='Publicidad de '+(c?c.nombre:'un cliente');o.ef={k:'gastada',id:pz[1]}}
  else if(pz[0]==='otro'||!pz[1]){o.q=txt||'Otro gasto'}
  else{var it=mapa(pz[0],pz[1]);o.q=(pz[0]==='equipo'?'Sueldo de ':'')+(it?it.nombre:'');o.ef={k:'item',col:pz[0],id:pz[1],mes:M,tc:tc,usd:!!(it&&it.moneda==='USD')}}
  return o;
}
function addMov(o){o.id=uid();S.movs=S.movs||[];S.movs.push(o);efecto(o,1);sync()}
function movPor(id){return (S.movs||[]).filter(function(m){return m.id===id})[0]}
function editMov(id,fn){var m=movPor(id);if(!m)return;if(!m.off)efecto(m,-1);fn(m);if(!m.off)efecto(m,1);sync();guardar();pintar()}
function delMov(id){var m=movPor(id);if(!m)return;if(!m.off)efecto(m,-1);S.movs=S.movs.filter(function(x){return x.id!==id});sync();guardar();pintar()}
function ajustar(banco,efectivo){
  var l=libro(),hecho=false;
  [['banco',banco,'Corrección para que cuadre con el banco'],['efectivo',efectivo,'Corrección para que cuadre con el efectivo']].forEach(function(x){
    if(x[1]===null||x[1]===undefined)return;var d=x[1]-l[x[0]];if(Math.abs(d)<.5)return;
    addMov({t:d>0?'in':'out',donde:x[0],m:Math.abs(d),f:hoyISO(),q:x[2],tipo:'ajuste'});hecho=true;
  });
  S.hayFecha=hoyISO();S.aviso=false;return hecho;
}
function cronologico(){
  var ini=S.ini||{},b=n(ini.banco),e=n(ini.efectivo);
  return (S.movs||[]).map(function(m,i){return {m:m,i:i}}).sort(function(p,q){return p.m.f<q.m.f?-1:p.m.f>q.m.f?1:p.i-q.i}).map(function(x){
    var m=x.m;if(!m.off){var v=n(m.m)*signo(m);if(m.donde==='efectivo')e+=v;else b+=v}
    return {m:m,b:b,e:e};
  });
}
function invertido(mes){return (S.movs||[]).reduce(function(t,m){return t+(!m.off&&m.t==='inv'&&(!mes||String(m.f).slice(0,7)===mes)?n(m.m):0)},0)}
function queHace(m){
  if(m.tipo==='ajuste')return 'Es una corrección: hace que la cuenta cuadre con lo que hay de verdad.';
  if(m.t==='inv')return m.cat==='publi'?'Es inversión en nuestra publicidad: lo que pagamos a la tarjeta en dólares. Sale del banco igual que un gasto. Lo que TikTok gastó de verdad se anota aparte, en la pestaña Pauta.':'Es inversión: sale del banco igual que un gasto, pero cuenta como lo que pusimos para crecer.';
  if(m.cli){var c=mapa('clientes',m.cli);return 'Suma a lo que pagó '+esc(c?c.nombre:'el cliente')+'.'}
  var e=m.ef;if(!e)return 'No está atado a nada más: solo sube o baja lo que tenemos.';
  if(e.k==='gastada'){var k=mapa('clientes',e.id);return 'Cuenta como publicidad ya gastada de '+esc(k?k.nombre:'un cliente')+'.'}
  if(e.k==='item'){var it=mapa(e.col,e.id);return 'Cuenta como pagado: '+esc(it?it.nombre:'')+' de '+MES[+e.mes.slice(5)-1]+'.'}
  if(e.k==='pauta')return 'Cuenta en nuestra publicidad del mes.';
  return '';
}
function colorMov(m){return m.off?'mut':m.t==='in'?'ok':m.t==='inv'?'warn':'bad'}

/* La pestaña */
var LF='todo',LCLI=null,LOPEN=null,LADD=null,LCFM=null;
function opcionesSel(t,sel){
  var o=t==='in'?S.clientes.map(function(c){return [c.id,c.nombre]}).concat([['otro','Otra entrada']]):
    t==='inv'?INV.map(function(x){return [x[0]+'|',x[1]]}):
    S.equipo.map(function(i){return ['equipo|'+i.id,'Sueldo de '+i.nombre]}).concat(
    S.servicios.map(function(i){return ['servicios|'+i.id,i.nombre]}),S.casa.map(function(i){return ['casa|'+i.id,i.nombre]}),
    S.clientes.filter(function(c){return n(c.pauta)>0}).map(function(c){return ['pcli|'+c.id,'Publicidad de '+c.nombre]}),[['otro|','Otro gasto']]);
  return o.map(function(x){return '<option value="'+esc(x[0])+'"'+(x[0]===sel?' selected':'')+'>'+esc(x[1])+'</option>'}).join('');
}
function vLibro(){

  h+='<section class="card"><div class="row btw"><h2>Punto de partida</h2></div><div class="sm mut">Lo que había antes del primer movimiento de abajo. Todo se suma o se resta desde aquí.'+(ini.nota?' <b>'+esc(ini.nota)+'</b>':'')+'</div><div class="fields">'+
    '<label>Fecha<input type="date" id="li_f" data-li="fecha" value="'+esc(ini.fecha||'')+'"></label>'+

  if(LADD){
    h+='<section class="card"><h2>Movimiento nuevo</h2>'+
      '<div class="row" style="flex-wrap:wrap"><div class="seg tipos"><button data-a="lAT" data-v="in" aria-pressed="'+(LADD.t==='in')+'">Entró</button><button data-a="lAT" data-v="out" aria-pressed="'+(LADD.t==='out')+'">Salió</button><button data-a="lAT" data-v="inv" aria-pressed="'+(LADD.t==='inv')+'">Inversión</button></div>'+
      '<div class="seg"><button data-a="lAD" data-v="banco" aria-pressed="'+(LADD.donde!=='efectivo')+'">Banco</button><button data-a="lAD" data-v="efectivo" aria-pressed="'+(LADD.donde==='efectivo')+'">Efectivo</button></div></div>'+
      '<div class="fields"><label>'+(LADD.t==='in'?'¿De quién?':LADD.t==='inv'?'¿En qué invertimos?':'¿Para qué?')+'<select id="la_sel" data-la="sel"><option value="">Elige</option>'+opcionesSel(LADD.t,LADD.sel)+'</select></label>'+

  } else h+='<button class="btn pri grande" data-a="lAdd">Agregar movimiento</button>';

        '<div class="row btw" style="flex-wrap:wrap"><div class="row" style="flex-wrap:wrap">'+
        (m.t!=='in'&&m.tipo!=='ajuste'?'<div class="seg tipos"><button data-a="lTipo" data-id="'+esc(m.id)+'" data-v="out" aria-pressed="'+(m.t==='out')+'">Salió</button><button data-a="lTipo" data-id="'+esc(m.id)+'" data-v="inv" aria-pressed="'+(m.t==='inv')+'">Inversión</button></div>':'')+
        '<div class="seg"><button data-a="lDonde" data-id="'+esc(m.id)+'" data-v="banco" aria-pressed="'+(m.donde!=='efectivo')+'">Banco</button><button data-a="lDonde" data-id="'+esc(m.id)+'" data-v="efectivo" aria-pressed="'+(m.donde==='efectivo')+'">Efectivo</button></div></div>'+
        (LCFM===m.id?'<button class="btn bad" data-a="lDelOk" data-id="'+esc(m.id)+'">Sí, borrar</button>':'<button class="btn" data-a="lDel" data-id="'+esc(m.id)+'">Borrar</button>')+'</div>'+
        '<div class="sm mut">Después de esto quedaban: banco '+bs(r.b)+' · efectivo '+bs(r.e)+'</div></div>';
    }
    h+='</div>';
  });
  return h+'</section>';
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;
  if(a==='verPagos'){TAB='libro';LCLI=id;LF='todo';LOPEN=null;try{location.hash='libro'}catch(x){}pintar();window.scrollTo(0,0);return}
  if(TAB!=='libro')return;
  if(a==='lFil'){LF=v;return pintar()}
  if(a==='lCli'){LCLI=null;return pintar()}
  if(a==='lAdd'){LADD={t:'in',donde:'banco',sel:'',f:hoyISO()};return pintar()}
  if(a==='lCancel'){LADD=null;return pintar()}
  if(a==='lAT'){['m','f','nota'].forEach(function(k){var el=document.querySelector('[data-la="'+k+'"]');if(el)LADD[k]=el.value});LADD.t=v;LADD.sel='';LADD.err='';return pintar()}
  if(a==='lAD'){['m','f','nota','q','usd'].forEach(function(k){var el=document.querySelector('[data-la="'+k+'"]');if(el)LADD[k]=el.value});LADD.donde=v;return pintar()}
  if(a==='lSave'){
    ['sel','m','f','q','nota','usd'].forEach(function(k){var el=document.querySelector('[data-la="'+k+'"]');if(el)LADD[k]=el.value});
    var m=parse(LADD.m);
    if(!LADD.sel){LADD.err='Elige '+(LADD.t==='in'?'de quién es':LADD.t==='inv'?'en qué invertimos':'para qué fue')+'.';return pintar()}
    if(!m||m<=0){LADD.err='Escribe el monto, solo el número.';return pintar()}
    addMov(armarMov(LADD.t,LADD.donde,LADD.sel,m,LADD.f||hoyISO(),(LADD.q||'').trim(),(LADD.nota||'').trim(),parse(LADD.usd)));
    LADD=null;guardar();return pintar();
  }
  if(a==='lOpen'){LOPEN=LOPEN===id?null:id;LCFM=null;return pintar()}
  if(a==='lOff')return editMov(id,function(m){m.off=!m.off});
  if(a==='lDonde')return editMov(id,function(m){m.donde=v});
  if(a==='lTipo')return editMov(id,function(m){m.t=v});
  if(a==='lDel'){LCFM=id;return pintar()}
  if(a==='lDelOk'){LCFM=null;LOPEN=null;return delMov(id)}
});
document.addEventListener('change',function(e){
  if(TAB!=='libro')return;
  var d=e.target.dataset;
  if(d.la&&LADD){LADD[d.la]=e.target.value;if(d.la==='sel')pintar();return}
  if(d.li){S.ini=S.ini||{};S.ini[d.li]=d.li==='fecha'?e.target.value:(parse(e.target.value)||0);sync();guardar();return pintar()}
  if(d.lm){var f=d.lm,val2=e.target.value;
    if(f==='m'){var p=parse(val2);if(!p||p<=0)return pintar();return editMov(d.id,function(m){m.m=p})}
    if(f==='usd'){var u=parse(val2);return editMov(d.id,function(m){if(u&&u>0)m.usd=u;else delete m.usd})}
    if(f==='f'&&!val2)return pintar();
    return editMov(d.id,function(m){m[f]=val2.trim?val2.trim():val2;if(f==='f'&&m.ef&&m.ef.mes){m.ef.mes=val2.slice(0,7)}});
  }
});
</script>

<script>
/* Clientes: lo que falta del servicio (lo nuestro) separado de lo que falta de su publicidad (de ellos). */
function cSplit(c,id){
  var x=c.cl.filter(function(i){return i.c.id===id})[0];if(!x||!x.total)return '';
  var r=function(l,ent,tot,falta){return '<div class="split"><span>'+l+'</span><span class="num">'+fmt(ent)+' de '+fmt(tot)+'</span>'+(falta>.5?'<span class="pill warn">falta '+fmt(falta)+'</span>':'<span class="pill ok">completo</span>')+'</div>'};
  return '<div class="splits">'+r('Servicio',x.servCobrado,x.servTotal,x.servFalta)+(x.pauta>0?r('Su publicidad',x.pautaEntro,x.pauta,x.pautaFalta):'')+'</div>';
}
function expFalta(c,k){
  var serv=k==='serv',t=serv?c.servFalta:c.pautaFalta,tit=serv?'Falta de servicio':'Falta de su publicidad';
  var r=c.cl.filter(function(x){return (serv?x.servFalta:x.pautaFalta)>.5}).map(function(x){return [esc(x.c.nombre||'Sin nombre'),serv?x.servFalta:x.pautaFalta]});
  r.push([tit,t,'t']);
  return {t:tit,v:bs(t),r:r,c:serv?['Es lo nuestro: lo que cada cliente todavía debe de nuestro servicio, sin contar su publicidad.','Lo primero que paga un cliente se cuenta como su publicidad; lo que sigue, como servicio.']:['Es plata de ellos para sus anuncios: cuando entra, se guarda aparte y no se usa para otra cosa.','Lo primero que paga un cliente se cuenta como su publicidad.'],s:'Lo que acordó cada cliente y sus pagos en Movimientos'};
}
</script>

<script>
/* La parte de Belén: un número, dos botones y quién nos debe. Usa la misma cuenta y los mismos datos que el resto. */
function isoB(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function ayerISO(){var d=new Date();d.setDate(d.getDate()-1);return isoB(d)}
function cuando(f){return f===hoyISO()?'hoy':f===ayerISO()?'ayer':dia(f)}
function campo(id){var e=document.getElementById(id);return e?e.value:''}
function guardado(c){
  var eq=S.equipo.map(function(i){return i.nombre}).join(' y ');
  var pr=S.servicios.map(function(i){return String(i.nombre||'').replace(/ \(.*\)/,'')}).join(', ');
  var L=[['Publicidad de los clientes','Es plata de ellos para sus anuncios',c.a.pautaClientes],
    ['Sueldo'+(eq?' de '+eq:''),'Lo que falta pagar este mes',c.a.equipo],
    ['Programas del trabajo',pr,c.a.servicios],
    ['Casa y mercado','Lo que falta de este mes',c.a.casa],
    ['Nuestra publicidad','La de esta semana',c.a.pautaPlan],
    ['Ahorro','La parte que va a la bóveda',c.a.boveda],
    ['Plata de emergencia','Siempre se queda en el banco',c.colchon]].filter(function(l){return l[2]>.5});
  return L.map(function(l){return '<div class="gfila"><div class="grow">'+esc(l[0])+'<small>'+esc(l[1])+'</small></div><span class="num">'+bs(l[2])+'</span></div>'}).join('');
}
function chip(f){
  var h=hoyISO();
  if(!f)return '<span class="pill">Sin fecha</span>';
  if(f===h)return '<span class="pill warn">Le toca hoy</span>';
  if(f<h)return '<span class="pill bad">Debía el '+dia(f)+'</span>';
  return '<span class="pill">Le toca el '+dia(f)+'</span>';
}
function respB(c){
  var g=parse(askB);if(!g||g<=0||!banco())return '';
  var v=c.veredicto(g);
  if(v.k==='hoy')return '<div class="ans ok"><b>Sí, alcanza.</b><span>Después de comprarlo nos quedan '+bs(v.despues)+' para usar.</span></div>';
  if(v.k==='fecha')return '<div class="ans warn"><b>Hoy no. Cuando pague '+esc(v.cobro.nombre)+', sí.</b><span>Le toca pagar '+(v.cobro.fecha===hoyISO()?'hoy':'el '+dia(v.cobro.fecha))+'.</span></div>';
  if(v.k==='colchon')return '<div class="ans warn"><b>Solo usando la plata de emergencia.</b><span>Mejor esperar a que paguen los clientes.</span></div>';
  return '<div class="ans bad"><b>Todavía no.</b><span>Aunque paguen todos, faltan '+bs(v.falta)+'.</span></div>';
}
function vBelenMain(c){
  var h='<div class="row btw"><h1 class="belh">Nuestra Caja</h1>'+(QUIEN==='belen'?'':'<button class="btn" data-go="libro">Ver todo</button>')+'</div>';
  if(FLASH)h+='<div class="flash" role="status"><span>'+FLASH+'</span>'+(UNDO?'<button class="btn" data-a="undoB">Deshacer</button>':'')+'</div>';
  h+='<section class="card"><div class="lbl mut">Podemos usar</div>';
  if(!banco())h+='<p class="say">Primero escribe cuánto hay hoy en el banco.</p><button class="btn acc full" data-a="modoB" data-v="banco">Escribir lo del banco</button>';
  else if(c.libre>.5)h+='<div class="big ok"><small>Bs</small>'+fmt(c.libre)+'</div><p class="say">Es lo que sobra después de guardar lo que hay que pagar.</p>';
  else h+='<div class="big bad"><small>Bs</small>0</div><p class="say">Hoy no sobra. Nos faltan '+bs(-c.libre)+' para pagar todo lo de este mes. Se arregla cuando paguen los clientes.</p>';
  if(banco()&&c.cuidar+c.colchon>.5){
    h+='<button class="link" data-a="verB" aria-expanded="'+VER+'">'+(VER?'Ocultar':'Ver')+' lo que guardamos aparte ('+bs(c.cuidar+c.colchon)+')</button>';
    if(VER)h+='<div class="guard">'+guardado(c)+'</div>';
  }
  h+='</section>';
  h+='<section class="card"><div class="row btw"><div class="grow"><div class="lbl mut">Tenemos</div><div class="mid">'+(banco()?bs(c.hay):'Falta')+'</div><div class="sm">Banco '+fmt(n(S.banco))+' · Efectivo '+fmt(n(S.efectivo))+'</div>'+(S.hayFecha?'<div class="sm mut">Revisado '+cuando(S.hayFecha)+'</div>':'')+'</div><button class="btn" data-a="modoB" data-v="banco">Corregir</button></div></section>';
  h+='<div class="dos"><button class="mov in" data-a="modoB" data-v="in">'+ic('mas')+'<span>Entró plata</span></button><button class="mov out" data-a="modoB" data-v="out">'+ic('menos')+'<span>Salió plata</span></button></div>';
  var deben=c.cl.filter(function(x){return x.deben>.5}).sort(function(p,q){var a=p.c.fecha||'9',b=q.c.fecha||'9';return a<b?-1:a>b?1:0});
  h+='<section class="card"><h2>Nos tienen que pagar</h2>';
  if(!deben.length)h+='<p class="mut">Nadie nos debe ahora.</p>';
  deben.forEach(function(x){
    h+='<div class="debe"><div><div class="nom">'+esc(x.c.nombre||'Sin nombre')+'</div><div style="margin-top:4px">'+chip(x.c.fecha)+'</div>'+(x.pautaFalta>.5?'<div class="sm mut" style="margin-top:4px">Servicio '+fmt(x.servFalta)+' · Su publicidad '+fmt(x.pautaFalta)+'</div>':'')+'</div><div class="monto">'+bs(x.deben)+'</div><button class="btn ok" data-a="pagoB" data-id="'+esc(x.c.id)+'">Ya pagó</button></div>';
  });
  if(deben.length>1)h+='<div class="tot">Si pagan todos, entran <b class="num">'+bs(c.porCobrar)+'</b></div>';
  h+='</section>';
  h+='<section class="card"><h2>¿Nos alcanza para comprar algo?</h2><label class="sm mut" for="askB">Escribe cuánto cuesta</label><input class="campo" id="askB" inputmode="decimal" autocomplete="off" placeholder="Bs" value="'+esc(askB)+'"><div id="askBAns">'+respB(c)+'</div></section>';
  var mv=cronologico().filter(function(r){return !r.m.off}).slice(-6).reverse().map(function(r){return r.m});
  if(mv.length){
    h+='<section class="card"><h2>Lo último que anotamos</h2>'+mv.map(function(m){var e=m.t==='in';return '<div class="hist"><span class="sm mut">'+cuando(m.f)+'</span><span class="grow">'+esc(m.q)+(m.donde==='efectivo'?' <span class="mut sm">(efectivo)</span>':'')+'</span><span class="num" style="color:var(--'+colorMov(m)+')">'+(e?'+':'−')+fmt(m.m)+'</span></div>'}).join('')+'</section>';
  }
  var listos=c.cl.filter(function(x){return x.total>0&&x.deben<=.5&&!x.c.terminado}).map(function(x){return esc(x.c.nombre)});
  if(listos.length)h+='<p class="sm mut" style="padding:0 4px">Ya pagaron todo: '+listos.join(', ')+'.</p>';
  h+='<button class="btn full" data-a="modoB" data-v="nuevo">Agregar un cliente nuevo</button>';
  return h;
}
function opt(v,l,sub,sel,attr){return '<button class="opt" data-'+(attr||'sel')+'="'+esc(v)+'" aria-pressed="'+(sel===v)+'">'+esc(l)+(sub?'<small>'+esc(sub)+'</small>':'')+'</button>'}
function dondeB(){return '<h2>¿Cómo nos pagaron?</h2><div class="opts">'+opt('banco','Por QR o al banco','',DONDE,'donde')+opt('efectivo','En efectivo','',DONDE,'donde')+'</div>'}
function dondeOut(){return '<h2>¿De dónde salió?</h2><div class="opts">'+opt('banco','Del banco','',DONDE,'donde')+opt('efectivo','Del efectivo','',DONDE,'donde')+'</div>'}
function pie(txt){return (ERR?'<p class="err" role="alert">'+ERR+'</p>':'')+'<button class="btn acc full" data-a="guardarB">'+txt+'</button><button class="btn full" data-a="cerrarB">Cancelar</button>'}
function vFormB(c){
  var h='<section class="card">';
  if(MODO==='banco'){
    h+='<label class="q" for="fMonto">¿Cuánto hay en el banco ahora?</label><p class="sm mut">Mira la app del banco y escribe el número tal cual. Si está bien, déjalo vacío.</p>'+
      '<input class="campo" id="fMonto" inputmode="decimal" autocomplete="off" placeholder="'+fmt(n(S.banco))+'" data-focus="1">'+
      '<label class="q" for="fEfe">¿Cuánto hay en efectivo?</label><p class="sm mut">Cuenta los billetes. Si está bien, déjalo vacío.</p>'+
      '<input class="campo" id="fEfe" inputmode="decimal" autocomplete="off" placeholder="'+fmt(n(S.efectivo))+'">'+pie('Guardar');
  }

    var deben=c.cl.filter(function(x){return x.deben>.5});
    h+='<h2>¿Quién pagó?</h2><div class="opts">'+deben.map(function(x){return opt(x.c.id,x.c.nombre,'nos debe '+bs(x.deben),SEL)}).join('')+opt('otro','Otra persona u otra cosa','',SEL)+'</div>';
    if(SEL){
      var x=deben.filter(function(d){return d.c.id===SEL})[0];
      h+=dondeB();
      if(SEL==='otro')h+='<label class="q" for="fQue">¿De qué es?</label><input class="campo txt" id="fQue" autocomplete="off" placeholder="Ej. una venta">';
      h+='<label class="q" for="fMonto">¿Cuánto entró?</label><input class="campo" id="fMonto" inputmode="decimal" autocomplete="off" placeholder="Bs" value="'+(x?Math.round(x.deben):'')+'"'+(SEL==='otro'?'':' data-focus="1"')+'>'+pie('Guardar');
    } else h+='<button class="btn full" data-a="cerrarB">Cancelar</button>';
  }
  else if(MODO==='out'){
    var o=S.equipo.map(function(i){return opt('equipo|'+i.id,'Sueldo de '+i.nombre,'',SEL)}).join('')+
      S.servicios.map(function(i){return opt('servicios|'+i.id,i.nombre,'programa del trabajo',SEL)}).join('')+
      S.casa.map(function(i){return opt('casa|'+i.id,i.nombre,'',SEL)}).join('')+
      opt('tarjeta|','Publicidad','pago a la tarjeta en dólares',SEL)+
      (S.clientes.some(function(k){return n(k.pauta)>0})?opt('pcli|','Publicidad de un cliente','con su plata',SEL):'')+
      opt('otro|','Otra cosa','',SEL);
    h+='<h2>¿En qué gastamos?</h2><div class="opts">'+o+'</div>';
    if(SEL==='pcli|')h+='<h2>¿De qué cliente?</h2><div class="opts">'+S.clientes.filter(function(k){return n(k.pauta)>0}).map(function(k){return opt(k.id,k.nombre,'',SEL2,'sel2')}).join('')+'</div>';
    if(SEL&&(SEL!=='pcli|'||SEL2)){
      h+=dondeOut();
      if(SEL==='tarjeta|')h+='<label class="q" for="fUsd">¿Cuántos dólares fueron? (si sabes)</label><input class="campo" id="fUsd" inputmode="decimal" autocomplete="off" placeholder="$">';
      if(SEL==='otro|')h+='<label class="q" for="fQue">¿Qué compramos?</label><input class="campo txt" id="fQue" autocomplete="off" placeholder="Ej. teclado">';
      h+='<label class="q" for="fMonto">¿Cuánto salió? (en bolivianos)</label><input class="campo" id="fMonto" inputmode="decimal" autocomplete="off" placeholder="Bs"'+(SEL==='otro|'?'':' data-focus="1"')+'>'+pie('Guardar');
    } else h+='<button class="btn full" data-a="cerrarB">Cancelar</button>';
  }
  else if(MODO==='nuevo'){
    h+='<h2>Cliente nuevo</h2>'+
      '<label class="q" for="fNom">¿Cómo se llama?</label><input class="campo txt" id="fNom" autocomplete="off" data-focus="1">'+
      '<label class="q" for="fTot">¿Cuánto nos va a pagar en total?</label><input class="campo" id="fTot" inputmode="decimal" autocomplete="off" placeholder="Bs">'+
      '<label class="q" for="fPag">¿Cuánto pagó hoy?</label><input class="campo" id="fPag" inputmode="decimal" autocomplete="off" placeholder="0">'+dondeB()+
      '<label class="q" for="fFecha">¿Qué día paga lo que falta?</label><input class="campo txt" id="fFecha" type="date">'+
      '<p class="sm mut">De cada cliente se guardan Bs 700 para su publicidad. Mauricio lo corrige si es otro monto.</p>'+pie('Guardar cliente');
  }
  return h+'</section>';
}
function vBelen(){var c=calcular(S,hoyISO());return '<div class="bel">'+(MODO?vFormB(c):vBelenMain(c))+'</div>'}
function movB(t,q,m){S.movs=S.movs||[];S.movs.push({f:hoyISO(),t:t,q:q,m:m});if(S.movs.length>60)S.movs.shift()}
function abrirB(m,sel){MODO=m;SEL=sel||null;DONDE='banco';SEL2=null;ERR='';FLASH='';UNDO=null;pintar();window.scrollTo(0,0)}
function cerrarB(){MODO=null;SEL=null;SEL2=null;ERR='';if(PEND){var p=PEND;PEND=null;aplicar(p)}else pintar();window.scrollTo(0,0)}
function fallo(t){ERR=t;pintar();var f=document.getElementById('fMonto')||document.getElementById('fNom');if(f)f.focus()}
function guardarForm(){
  var hoy=hoyISO(),M=hoy.slice(0,7),antes=JSON.stringify(S),hab=banco(),m=parse(campo('fMonto'));
  var dn=DONDE==='efectivo'?' en efectivo':'';
  if(MODO==='banco'){
    var ef=parse(campo('fEfe'));
    if((m!==null&&m<0)||(ef!==null&&ef<0))return fallo('Escribe solo números.');
    ajustar(m,ef);FLASH='Listo. Tenemos '+bs(n(S.hay))+': banco '+fmt(n(S.banco))+' y efectivo '+fmt(n(S.efectivo))+'.';
  }
  else if(MODO==='in'){
    if(!m||m<=0)return fallo('Escribe cuánto entró, solo el número.');
    var o=armarMov('in',DONDE,SEL,m,hoy,campo('fQue').trim());addMov(o);
    FLASH='Listo. Entraron '+bs(m)+dn+' de '+esc(o.q)+'.';
  }
  else if(MODO==='out'){
    if(!m||m<=0)return fallo('Escribe cuánto salió, solo el número.');
    var o2=armarMov('out',DONDE,SEL==='pcli|'?'pcli|'+SEL2:SEL,m,hoy,campo('fQue').trim(),'',parse(campo('fUsd')));addMov(o2);
    FLASH='Listo. Salieron '+bs(m)+dn+' para '+esc(o2.q)+'.';
  }
  else if(MODO==='nuevo'){
    var nom=campo('fNom').trim(),tot=parse(campo('fTot')),pg=parse(campo('fPag'))||0,fe=campo('fFecha');
    if(!nom)return fallo('Escribe el nombre del cliente.');
    if(!tot||tot<=0)return fallo('Escribe cuánto nos va a pagar en total.');
    var nid=uid();
    S.clientes.push({id:nid,nombre:nom,total:tot,pauta:tot>=2000?700:0,pago:0,pagoAntes:0,gastada:0,fecha:fe,cierre:hoy,garantia:Math.round(tot/2),canal:'TikTok',nota:'Lo cargó Belén. Falta confirmar cuánto es de publicidad.'});
    if(pg>0)addMov(armarMov('in',DONDE,nid,pg,hoy));else sync();
    FLASH='Listo. '+esc(nom)+' ya está en la lista.';
  }
  if(!hab&&MODO!=='banco')FLASH+=' Falta escribir cuánto hay en el banco.';
  UNDO=antes;PEND=null;MODO=null;SEL=null;SEL2=null;ERR='';
  pintar();window.scrollTo(0,0);guardar();
}
document.addEventListener('input',function(e){
  if(e.target.id==='askB'){askB=e.target.value;var a=document.getElementById('askBAns');if(a)a.innerHTML=respB(calcular(S,hoyISO()))}
});
document.addEventListener('keydown',function(e){
  if(TAB!=='belen'||!MODO)return;
  if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();guardarForm()}
  if(e.key==='Escape')cerrarB();
});
document.addEventListener('click',function(e){
  if(TAB!=='belen')return;
  var s=e.target.closest('[data-sel]');if(s){SEL=s.dataset.sel;SEL2=null;ERR='';pintar();return}
  var s2=e.target.closest('[data-sel2]');if(s2){SEL2=s2.dataset.sel2;ERR='';pintar();return}
  var s3=e.target.closest('[data-donde]');if(s3){var keep={};['fMonto','fQue','fNom','fTot','fPag','fFecha','fUsd'].forEach(function(k){keep[k]=campo(k)});DONDE=s3.dataset.donde;pintar();Object.keys(keep).forEach(function(k){var el=document.getElementById(k);if(el&&keep[k])el.value=keep[k]});return}
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a;
  if(a==='modoB')return abrirB(b.dataset.v);
  if(a==='pagoB')return abrirB('in',b.dataset.id);
  if(a==='cerrarB')return cerrarB();
