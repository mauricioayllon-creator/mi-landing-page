<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f5f7">
<title>Equipo · Grow Business</title>
<link rel="icon" type="image/png" href="/grow-business-logo.png">
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#a1a1a6;--line:#e8e8ed;--azul:#0071e3;--verde:#1f9d55;--rojo:#c9302c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--azul);text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.marca{display:flex;align-items:center;gap:9px;font-weight:600}
.marca img{width:30px;height:30px;object-fit:contain;display:block}.candado form>img{width:64px;height:64px;object-fit:contain;margin-bottom:10px}
.salir{border:0;background:none;color:var(--ink2);font-size:14px;cursor:pointer;padding:8px}
h1{font-size:28px;letter-spacing:-.02em;margin:6px 0 14px}
.tabs{display:flex;gap:4px;overflow-x:auto;background:#e9e9ee;padding:4px;border-radius:13px;margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;padding:9px 13px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap;text-decoration:none}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tab svg{width:16px;height:16px}
.tab b{font-weight:600;font-size:12px;background:var(--azul);color:#fff;border-radius:9px;padding:0 6px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.cab h2{font-size:18px;margin:0;letter-spacing:-.01em}
.cab small{color:var(--ink2);font-size:13px;text-align:right}
.it{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.it:first-of-type{border-top:0}
.ck{flex:0 0 26px;height:26px;border-radius:50%;border:1.6px solid var(--ink3);background:#fff;cursor:pointer;display:grid;place-items:center;padding:0;margin-top:1px}
.ck svg{width:14px;height:14px;opacity:0;color:#fff}
.ck.si{background:var(--verde);border-color:var(--verde)}.ck.si svg{opacity:1}
.tx{flex:1;min-width:0}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.tx p{margin:6px 0 0;color:var(--ink2);font-size:14px}
.tx small{display:block;color:var(--ink3);font-size:12.5px}
.mas{margin-top:8px;color:var(--ink2);font-size:14px}
.mas>summary{padding:6px 0;color:var(--azul)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.fila:first-of-type{border-top:0}
.fila div small{display:block;color:var(--ink2);font-size:13px}
.btn{border:0;background:#ededf2;border-radius:10px;padding:8px 13px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-block;color:var(--ink)}
.btn.azul{background:var(--azul);color:#fff}
.bts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.clave{font:600 15px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em}
.vacio{color:var(--ink2);text-align:center;padding:30px 12px}
.prom p{margin:6px 0;font-size:14px;color:var(--ink2)}.prom b{color:var(--ink)}
.doc{background:var(--card);border-radius:18px;padding:18px;overflow-x:auto;font-size:15px}
.doc h1{font-size:22px}.doc h2{font-size:18px}.doc h3{font-size:16px}
.doc table{border-collapse:collapse;font-size:14px}.doc td,.doc th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.candado{min-height:100vh;display:grid;place-items:center;padding:20px}
.candado form{background:#fff;border-radius:22px;padding:28px 24px;width:100%;max-width:360px;text-align:center}
.candado h2{margin:0 0 4px;font-size:22px}.candado p{color:var(--ink2);margin:0 0 18px;font-size:15px}
.candado input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;outline:none}
.candado button{width:100%;padding:13px}
.err{color:var(--rojo);font-size:14px;min-height:20px;margin:10px 0 0!important}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw}
</style>
</head>
<body>
<div id="app"></div>
<script src="/clientes/motor/config.js"></script>
<script src="config.js"></script>
<script src="/clientes/motor/pasos.js"></script>
<script src="pasos-guia.js"></script>
<script src="documentos.js"></script>
<script>
(function () {
  "use strict";
  var APP = document.getElementById("app"), LS = "equipo-clave", S = null;
  var P = new URLSearchParams(location.search).get("p");
  var NOMBRE_LINK = P === "julio" ? "Julio" : P === "belen" ? "Belén" : "";
  var CAJA = "https://claude.ai/artifact/K7bAHWknKrR6q8JW3NUYwH#belen";
  var HOY = new Intl.DateTimeFormat("en-CA", { timeZone: "America/La_Paz", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  var AHORA = new Intl.DateTimeFormat("en-GB", { timeZone: "America/La_Paz", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date());
  var I = {
    tareas: '<path d="M9 11l3 3 8-8M20 12v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1h11"/>',
    agenda: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    gente: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 5a3.5 3.5 0 010 7M18 14c2 .7 3 2.7 3 6"/>',
    camara: '<rect x="3" y="7" width="13" height="11" rx="2"/><path d="M16 11l5-3v9l-5-3"/>',
    doc: '<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/>',
    caja: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/>',
    check: '<path d="M5 12l5 5 9-10"/>'
  };
  function ic(n) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + I[n] + "</svg>"; }
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function leer() { try { return localStorage.getItem(LS) || ""; } catch (e) { return ""; } }
  function guardar(k) { try { if (k) localStorage.setItem(LS, k); else localStorage.removeItem(LS); } catch (e) { /* sin memoria: pedirá la clave otra vez */ } }
  function api(d) { return fetch(window.PANEL_ENDPOINT, { method: "POST", body: JSON.stringify(d) }).then(function (r) { return r.json(); }); }
  function toast(t) { var e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.appendChild(e); setTimeout(function () { e.remove(); }, 2800); }
  function fecha(f, h) { var d = new Date(f + "T12:00:00"); return d.toLocaleDateString("es-BO", { weekday: "short", day: "numeric", month: "short" }) + (h ? " · " + h : ""); }

  function candado(fallo) {
    APP.innerHTML = '<div class="candado"><form><img src="/grow-business-logo.png" alt="Grow Business"><h2>' + (NOMBRE_LINK ? "Hola, " + esc(NOMBRE_LINK) : "Equipo Grow Business") + '</h2><p>Escribe tu clave para entrar.</p><input id="k" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Clave" required><button class="btn azul" type="submit">Entrar</button><p class="err" id="er">' + (fallo ? "Esa clave no es correcta." : "") + "</p></form></div>";
    APP.querySelector("form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var k = document.getElementById("k").value.trim(), b = APP.querySelector("button");
      b.disabled = true; b.textContent = "Entrando…";
      abrir(k, true);
    });
  }
  function abrir(k, aMano) {
    api({ accion: "equipo-ver", k: k }).then(function (r) {
      if (!r.ok) { guardar(""); return candado(aMano || r.error === "clave"); }
      guardar(k);
      S = { k: k, d: r, tab: "tareas" };
      return traerCalendario().then(pintar);
    }).catch(function () {
      if (aMano) { candado(false); document.getElementById("er").textContent = "No hay conexión. Intenta de nuevo."; }
      else APP.innerHTML = '<div class="vacio">No hay conexión. Recarga la página.</div>';
    });
  }
  /** Las fechas y el Meet salen en vivo de Google Calendar. Si falla, queda lo último guardado. */
  function traerCalendario() {
    if (!window.AGENDA_ENDPOINT) return Promise.resolve();
    return Promise.all(S.d.clientes.map(function (c) {
      if (!c.camino) return null;
      return Promise.race([
        fetch(window.AGENDA_ENDPOINT + "?accion=citas&cliente=" + encodeURIComponent(c.carpeta)).then(function (r) { return r.json(); }).then(function (r) { if (r && r.ok) c.camino = window.PasosGB.aplicarCalendario(c.camino, r.citas, HOY, AHORA); }).catch(function () {}),
        new Promise(function (ok) { setTimeout(ok, 7000); })
      ]);
    }));
  }
  function trabajoDe(q) {
    return S.d.clientes.filter(function (c) { return c.camino; }).map(function (c) {
      var plan = window.GuiaGB.plan(c.camino, window.PasosGB), ahora = [], luego = [], hechas = [];
      plan.pasos.forEach(function (p, i) {
        p.items.forEach(function (it) {
          if (it.q !== q) return;
          var x = { it: it, paso: p };
          if (it.hecho) hechas.push(x); else if (i <= plan.cur) ahora.push(x); else luego.push(x);
        });
      });
      var cur = plan.pasos[plan.cur];
      return { c: c, ahora: ahora, luego: luego, hechas: hechas, vamos: cur ? cur.t : "Terminado" };
    });
  }
  function fila(x, c, puede) {
    var it = x.it, si = !!it.hecho;
    return '<div class="it">' + (puede ? '<button class="ck' + (si ? " si" : "") + '" data-marca="' + esc(it.id) + '" data-c="' + esc(c.carpeta) + '" data-paso="' + esc(x.paso.id) + '" data-si="' + (si ? 1 : 0) + '" aria-label="Marcar ' + esc(it.t) + '">' + ic("check") + "</button>" : "") +
      '<div class="tx"><details><summary>' + esc(it.t) + "<small>" + esc(it.viene || x.paso.t) + "</small></summary>" + (it.como ? "<p>" + esc(it.como) + "</p>" : "") + (it.sale ? "<p><b>Tiene que salir:</b> " + esc(it.sale) + "</p>" : "") + "</details></div></div>";
  }
  function bloqueTareas(q, puede) {
    var h = trabajoDe(q).filter(function (t) { return t.ahora.length || t.luego.length || t.hechas.length; }).sort(function (a, b) { return b.ahora.length - a.ahora.length; }).map(function (t) {
      var ext = function (titulo, l) { return l.length ? '<details class="mas"><summary>' + titulo + " (" + l.length + ")</summary>" + l.map(function (x) { return fila(x, t.c, puede); }).join("") + "</details>" : ""; };
      return '<div class="card"><div class="cab"><h2>' + esc(t.c.nombre) + "</h2><small>" + esc(t.vamos) + "</small></div>" + (t.ahora.length ? t.ahora.map(function (x) { return fila(x, t.c, puede); }).join("") : '<div class="mas">Nada por ahora.</div>') + ext("Después", t.luego) + ext("Hechas", t.hechas) + "</div>";
    }).join("");
    return h || '<div class="vacio">No hay tareas.</div>';
  }
  function agenda(soloGrab, conMeet) {
    var l = [];
    S.d.clientes.forEach(function (c) {
      if (!c.camino) return;
      window.PasosGB.armar(c.camino).forEach(function (p) {
        if ((p.tipo === "grabacion" || (!soloGrab && p.tipo === "sesion")) && p.fecha && p.fecha >= HOY) l.push({ c: c, p: p });
      });
    });
    l.sort(function (a, b) { return (a.p.fecha + a.p.hora).localeCompare(b.p.fecha + b.p.hora); });
    if (!l.length) return '<div class="vacio">' + (soloGrab ? "No hay grabaciones agendadas." : "No hay sesiones agendadas.") + "</div>";
    return '<div class="card">' + l.map(function (x) {
      return '<div class="fila"><div><b>' + esc(x.c.nombre) + "</b><small>" + esc(x.p.t) + " · " + esc(fecha(x.p.fecha, x.p.hora)) + "</small></div>" + (conMeet && x.p.meet ? '<a class="btn azul" target="_blank" rel="noopener" href="' + esc(x.p.meet) + '">Entrar</a>' : "") + "</div>";
    }).join("") + "</div>";
  }
  function clientesBelen() {
    return S.d.clientes.map(function (c) {
      var f = c.ficha || {}, plan = c.camino ? window.GuiaGB.plan(c.camino, window.PasosGB) : null, cur = plan && plan.pasos[plan.cur];
      var prom = f.promesa || f.piso || f.garantia || f.falta ? '<details class="mas prom"><summary>Lo que se le prometió</summary>' + (f.promesa ? "<p>" + esc(f.promesa) + "</p>" : "") + (f.piso ? "<p><b>Piso:</b> " + esc(f.piso) + "</p>" : "") + (f.garantia ? "<p><b>Garantía:</b> " + esc(f.garantia) + "</p>" : "") + (f.falta ? "<p><b>Falta:</b> " + esc(f.falta) + "</p>" : "") + "</details>" : "";
      return '<div class="card"><div class="cab"><h2>' + esc(c.nombre) + "</h2><small>" + esc(cur ? cur.t : "") + '</small></div><div class="fila"><div><small>Su clave</small><span class="clave">' + esc(c.clave || "") + '</span></div></div><div class="bts"><button class="btn azul" data-copiar="' + esc(c.carpeta) + '">Copiar link y clave</button><a class="btn" target="_blank" rel="noopener" href="/clientes/' + esc(c.carpeta) + '">Ver su panel</a></div>' + prom + "</div>";
    }).join("");
  }
  function documentos() {
    if (S.doc) return '<button class="btn" data-doc-volver style="margin-bottom:12px">Volver</button><div class="doc">' + window.DOCS.html(S.doc.texto) + "</div>";
    if (!S.docs) { api({ accion: "equipo-docs", k: S.k }).then(function (r) { if (r.ok) { S.docs = r.docs; pintar(); } }); return '<div class="vacio">Cargando…</div>'; }
    if (!S.docs.length) return '<div class="vacio">Todavía no hay documentos.</div>';
    var g = {};
    S.docs.forEach(function (d) { var k = d.ruta.split("/").slice(0, d.ruta.indexOf("clientes/") === 0 ? 2 : 1).join("/"); (g[k] = g[k] || []).push(d); });
    return Object.keys(g).sort().map(function (k) {
      var c = S.d.clientes.filter(function (x) { return "clientes/" + x.carpeta === k; })[0];
      return '<div class="card"><div class="cab"><h2>' + esc(c ? c.nombre : k === "nosotros" ? "Grow Business" : k.replace("clientes/", "")) + "</h2></div>" + g[k].map(function (d) { return '<div class="fila"><div>' + esc(d.titulo) + '</div><button class="btn" data-doc="' + esc(d.ruta) + '">Abrir</button></div>'; }).join("") + "</div>";
    }).join("");
  }
  function pintar() {
    var belen = S.d.quien === "belen", q = S.d.q;
    var tabs = belen ? [["tareas", "Tareas", "tareas"], ["agenda", "Agenda", "agenda"], ["clientes", "Clientes", "gente"], ["julio", "Julio", "camara"], ["docs", "Documentos", "doc"]] : [["tareas", "Tareas", "tareas"], ["agenda", "Grabaciones", "agenda"], ["docs", "Guiones", "doc"]];
    var pend = trabajoDe(q).reduce(function (n, t) { return n + t.ahora.length; }, 0);
    var cuerpo = S.tab === "agenda" ? agenda(!belen, belen) : S.tab === "clientes" ? clientesBelen() : S.tab === "julio" ? bloqueTareas("J", false) : S.tab === "docs" ? documentos() : bloqueTareas(q, true);
    APP.innerHTML = '<div class="wrap"><header><span class="marca"><img src="/grow-business-logo.png" alt=""> Grow Business</span><button class="salir" data-salir>Salir</button></header><h1>Hola, ' + esc(S.d.nombre) + '</h1><nav class="tabs">' + tabs.map(function (t) { return '<button class="tab' + (S.tab === t[0] ? " on" : "") + '" data-tab="' + t[0] + '">' + ic(t[2]) + t[1] + (t[0] === "tareas" && pend ? "<b>" + pend + "</b>" : "") + "</button>"; }).join("") + (belen ? '<a class="tab" target="_blank" rel="noopener" href="' + CAJA + '">' + ic("caja") + "Caja</a>" : "") + "</nav>" + cuerpo + "</div>";
  }
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest && ev.target.closest("[data-tab],[data-marca],[data-salir],[data-copiar],[data-doc],[data-doc-volver]");
    if (!b) return;
    if (b.hasAttribute("data-salir")) { guardar(""); S = null; return candado(false); }
    if (b.dataset.tab) { S.tab = b.dataset.tab; S.doc = null; return pintar(); }
    if (b.hasAttribute("data-doc-volver")) { S.doc = null; return pintar(); }
    if (b.dataset.doc) { return api({ accion: "equipo-doc", k: S.k, ruta: b.dataset.doc }).then(function (r) { if (r.ok) { S.doc = r.doc; pintar(); window.scrollTo(0, 0); } else toast("No se pudo abrir."); }).catch(function () { toast("Sin conexión."); }); }
    if (b.dataset.copiar) {
      var c = S.d.clientes.filter(function (x) { return x.carpeta === b.dataset.copiar; })[0];
      var t = "Tu panel de Grow Business:\nhttps://mauricio-ayllon.com/clientes/" + c.carpeta + "\nTu clave: " + c.clave;
      return (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast("Copiado"); }).catch(function () { toast("La clave es " + c.clave); });
    }
    if (b.dataset.marca) {
      var cl = S.d.clientes.filter(function (x) { return x.carpeta === b.dataset.c; })[0], id = b.dataset.marca, antes = cl.camino.it[id], hecho = b.dataset.si !== "1";
      if (hecho) cl.camino.it[id] = "ok:" + b.dataset.paso; else delete cl.camino.it[id];
      pintar();
      api({ accion: "equipo-marcar", k: S.k, carpeta: cl.carpeta, id: id, paso: b.dataset.paso, hecho: hecho }).then(function (r) { if (!r.ok) throw 0; }).catch(function () {
        if (antes) cl.camino.it[id] = antes; else delete cl.camino.it[id];
        pintar(); toast("No se guardó. Intenta de nuevo.");
      });
    }
  });
  var k = leer();
  if (k) abrir(k, false); else candado(false);
})();
</script>
</body>
</html>
