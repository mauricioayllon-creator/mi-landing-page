<style>
  body { padding-bottom: env(safe-area-inset-bottom); }

  /* ---------- portada ---------- */
  .hero { position: relative; overflow: hidden; color: #fff; padding: 16px 18px 92px;
    background:
      radial-gradient(900px 420px at 110% -20%, rgba(92, 165, 255, .55), transparent 60%),
      radial-gradient(520px 360px at -20% 115%, rgba(49, 217, 109, .22), transparent 62%),
      linear-gradient(160deg, #1a6fe0 0%, #0b4bb0 42%, #082e6e 78%, #051d47 100%); }
  .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(255, 255, 255, .09) 1px, transparent 1px); background-size: 22px 22px;
    mask-image: linear-gradient(180deg, #000, transparent 85%); -webkit-mask-image: linear-gradient(180deg, #000, transparent 85%); }
  .hero-in { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; }
  .hero-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .marca { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px; letter-spacing: .01em; }
  .marca i { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: #fff; color: var(--blue-2); font-style: normal; font-family: var(--display); font-weight: 800; font-size: 14px; }
  .btn-ico.vidrio { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .2); color: #fff; }
  .btn-ico.vidrio:hover { background: rgba(255, 255, 255, .2); }
  .hero-cliente { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .hero-cliente .avatar { width: 58px; height: 58px; border-radius: 18px; font-size: 21px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .28); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .5); }
  .hero-cliente small { display: block; font-size: 12.5px; font-weight: 700; color: rgba(255, 255, 255, .7); letter-spacing: .02em; }
  .hero-cliente h1 { font-family: var(--display); font-size: 27px; line-height: 1.05; letter-spacing: -.025em; overflow-wrap: anywhere; }
  .hero-motor { display: flex; align-items: center; gap: 12px; }
  .hero-motor .trio { width: 168px; margin: -10px -6px -10px -14px; }
  .hero-txt { min-width: 0; flex: 1; }
  .hero-barra { margin-top: 16px; padding: 14px 14px 13px; border-radius: 22px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .hb-top { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 11px; }
  .hb-top > b { font-family: var(--display); font-size: 44px; line-height: .86; letter-spacing: -.045em; flex: none; }
  .hb-top > b small { font-size: 21px; margin-left: 1px; color: rgba(255, 255, 255, .75); }
  .hb-top > div { min-width: 0; }
  .hb-top > div > span { display: block; font-size: 13px; font-weight: 800; color: rgba(255, 255, 255, .92); }
  .hb-top em { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-style: normal; font-size: 12.5px; font-weight: 600; color: rgba(255, 255, 255, .68); margin-top: 1px; }
  .hb-top em .i { color: var(--lima); margin: -2px 3px 0 0; }
  .hero-freno { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 12px; padding: 10px 12px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .1); color: #fff; text-align: left; cursor: pointer; transition: transform .15s var(--ease); }
  .hero-freno:active { transform: scale(.98); }
  .hero-freno.tarde { border-color: transparent; background: linear-gradient(135deg, #f7b538, #d97706); box-shadow: 0 12px 26px -12px rgba(217, 119, 6, .95); }
  .hero-freno > .i:first-child { width: 36px; height: 36px; padding: 8px; border-radius: 12px; background: rgba(255, 255, 255, .2); }
  .hero-freno span { flex: 1; min-width: 0; }
  .hero-freno small { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; opacity: .85; }
  .hero-freno b { display: block; font-size: 15px; line-height: 1.25; }
  .hero-freno em { display: block; font-style: normal; font-size: 12.5px; font-weight: 600; opacity: .88; }
  .hero-txt small { display: block; font-size: 12px; font-weight: 800; color: var(--lima); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
  .hero-txt .ahora { font-family: var(--display); font-size: 25px; line-height: 1.08; letter-spacing: -.025em; margin-bottom: 10px; }
  .hero-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .hero-cuenta { margin-top: 22px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .16); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 14px; font-weight: 600; }
  .hero-cuenta b { font-family: var(--display); font-size: 30px; line-height: 1; color: var(--lima); letter-spacing: -.03em; }
  .hero-cuenta span { color: rgba(255, 255, 255, .92); }
  .hero-cuenta em { font-style: normal; display: block; font-size: 12.5px; color: rgba(255, 255, 255, .65); }

  .cuerpo { position: relative; z-index: 2; max-width: 600px; margin: -64px auto 0; padding: 0 14px 110px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .cuerpo > * { min-width: 0; }
  .previa { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-radius: 16px; background: var(--amber-soft); color: var(--amber-ink); font-size: 13.5px; font-weight: 700; }

  /* ---------- barra pequeña al bajar ---------- */
  .mini { position: fixed; top: 0; left: 0; right: 0; z-index: 60; transform: translateY(-110%); transition: transform .35s var(--ease); background: rgba(8, 46, 110, .92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff; }
  .mini.ver { transform: none; }
  .mini-in { max-width: 600px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .mini .avatar { width: 32px; height: 32px; border-radius: 10px; font-size: 12px; background: rgba(255, 255, 255, .15); }
  .mini-txt { flex: 1; min-width: 0; }
  .mini-txt b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-txt span { display: block; font-size: 12px; color: rgba(255, 255, 255, .7); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .pct { font-family: var(--display); font-weight: 800; font-size: 17px; color: var(--lima); }
  .mini-prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .12); }
  .mini-prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--lima-2), var(--lima)); box-shadow: 0 0 8px rgba(49, 217, 109, .6); }
  .mueve { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; margin-top: 7px; padding: 3px 9px 3px 6px; border-radius: 99px; background: var(--blue-soft); color: var(--blue-2); font-size: 12px; font-weight: 800; }
  .mueve span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- cómo se mueve tu campaña (el motor) ---------- */
  .maq-intro { margin: -6px 0 16px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .cadena { list-style: none; margin: 0; padding: 0; }
  .nodo { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding-bottom: 20px; }
  .nodo > .rueda, .nodo > .meta-ico { justify-self: center; z-index: 1; }
  .nodo:not(:last-child)::before { content: ""; position: absolute; left: 26.5px; top: 47px; bottom: 1px; width: 3px; border-radius: 3px; background: repeating-linear-gradient(180deg, #d5deea 0 6px, transparent 6px 12px); }
  .nodo.actual:not(:last-child)::before { top: 59px; background: repeating-linear-gradient(180deg, var(--blue) 0 6px, transparent 6px 12px) 0 0 / 3px 24px; animation: flujo .9s linear infinite reverse; }
  .nodo.e-listo:not(:last-child)::before, .nodo.e-falta:not(:last-child)::before { background: linear-gradient(180deg, var(--lima), #a7ebc1); }
  .nodo-c { min-width: 0; padding-top: 8px; }
  .nodo.actual .nodo-c { margin-top: -2px; padding: 14px; border-radius: 20px; background: linear-gradient(180deg, #edf4ff, #f8fbff); border: 1px solid #d3e3fb; }
  .nodo.actual.e-trabado .nodo-c { background: linear-gradient(180deg, #fff4dc, #fffbf3); border-color: #f5d391; }
  .nodo-cab { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .nodo-cab b { font-size: 15px; line-height: 1.3; }
  .nodo.actual .nodo-cab b { font-family: var(--display); font-size: 18px; letter-spacing: -.015em; }
  .nodo.e-espera .nodo-cab b { color: var(--ink-2); font-weight: 700; }
  .nodo-fecha { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 700; color: var(--ink-3); }
  .nodo.e-listo .nodo-fecha { color: var(--lima-2); }
  .nodo-para { margin-top: 8px; font-size: 14px; font-weight: 800; color: var(--navy); }
  .nodo-det { margin-top: 3px; font-size: 13.5px; color: #34507e; }
  .engs-tit { display: flex; align-items: center; gap: 6px; margin: 14px 0 8px; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
  .engs { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 7px; }
  .engs-tit + .engs { margin-top: 0; }
  .eng { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; border-radius: 15px; background: #fff; border: 1px solid var(--line); box-shadow: var(--sh-1); }
  .eng.e-hecho, .eng.e-espera { box-shadow: none; background: rgba(255, 255, 255, .65); }
  .eng.e-hecho .eng-txt b { color: var(--ink-2); font-weight: 700; }
  .eng.e-atrasado { border-color: #f6c1c3; }
  .eng.e-hoy { border-color: #f5d391; }
  .eng.e-hoy.q-yo { border-color: #c4dafb; }
  .eng-txt { flex: 1; min-width: 0; }
  .eng-txt b { display: block; font-size: 14px; line-height: 1.3; }
  .eng-txt small { display: block; margin-top: 1px; font-size: 12px; font-weight: 700; color: var(--ink-3); }
  .eng.q-cliente:not(.e-hecho):not(.e-espera) .eng-txt small { color: var(--amber-ink); }
  .eng.e-atrasado .eng-txt small { color: var(--coral-ink); }
  .eng.e-espera .eng-txt small { color: var(--blue-2); }
  .eng .btn { flex: none; }
  .pildoras { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .pild { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 2px 9px 2px 3px; border-radius: 99px; background: var(--line-2); color: var(--ink-2); font-size: 12px; font-weight: 700; }
  .pild span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pild.q-cliente { background: var(--amber-soft); color: var(--amber-ink); }
  .pild.e-hecho, .pild.e-espera { background: var(--lima-soft); color: var(--lima-2); }
  .pild.e-atrasado { background: var(--coral-soft); color: var(--coral-ink); }
  .meta-ico { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(135deg, var(--blue-2), var(--navy-2)); color: var(--lima); box-shadow: var(--sh-azul); }
  .nodo.meta.lograda .meta-ico { background: linear-gradient(135deg, var(--lima-2), #0a6b35); color: #fff; }
  .nodo.meta .nodo-c small { display: block; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
  .nodo.meta .nodo-c b { display: block; font-family: var(--display); font-size: 18px; line-height: 1.25; letter-spacing: -.01em; color: var(--navy); }
  /* cómo se lee */
  .leer { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 16px; }
  .leer li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; }
  .leer li > :first-child { justify-self: center; }
  .leer b { display: block; font-size: 15px; line-height: 1.3; }
  .leer span.t { display: block; font-size: 13.5px; color: var(--ink-2); font-weight: 500; }
  .barrita { display: flex; gap: 2px; width: 54px; height: 12px; padding: 2px; border-radius: 99px; background: var(--line-2); }
  .barrita i { flex: 1; border-radius: 99px; background: rgba(11, 21, 48, .08); }
  .barrita i.l { background: var(--lima-2); } .barrita i.g { background: var(--blue); }
  .caja-ico { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; background: linear-gradient(135deg, var(--blue-2), var(--navy-2)); color: var(--lima); }

  /* ---------- te toca ---------- */
  .toca { border: 0; background: linear-gradient(180deg, #fff8e8 0%, #fff 70%); box-shadow: 0 0 0 1.5px #f7d48c, var(--sh-2); }
  .toca .burbuja { background: var(--amber); color: #fff; box-shadow: 0 8px 18px -8px rgba(245, 158, 11, .9); }
  .toca.nada { background: linear-gradient(180deg, #ecfbf2 0%, #fff 80%); box-shadow: 0 0 0 1.5px #b6ebca, var(--sh-1); }
  .toca.nada .burbuja { background: var(--lima-2); box-shadow: 0 8px 18px -8px rgba(18, 161, 80, .9); }
  .tarea { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 12px; padding: 14px; border-radius: 18px; background: #fff; border: 1px solid #f3dfb4; margin-top: 10px; }
  .tarea.vencida { border-color: #f6c1c3; background: #fffafa; }
  .tarea .t-ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--amber-soft); color: var(--amber-ink); }
  .tarea.vencida .t-ico { background: var(--coral-soft); color: var(--coral-ink); }
  .tarea h3 { font-size: 15.5px; line-height: 1.3; }
  .tarea .cuando { margin: 6px 0 0; }
  .tarea .porque { margin-top: 8px; font-size: 13.5px; color: var(--ink-2); }
  .tarea details { margin-top: 8px; font-size: 13.5px; }
  .tarea details summary { cursor: pointer; font-weight: 800; color: var(--blue-2); list-style: none; display: inline-flex; align-items: center; gap: 4px; }
  .tarea details summary::-webkit-details-marker { display: none; }
  .tarea details[open] summary .i { transform: rotate(90deg); }
  .tarea details p { margin-top: 6px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
  .tarea .acc { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .luego { margin-top: 12px; border-radius: 16px; background: var(--surface-2); padding: 4px 14px; }
  .luego summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 0; font-weight: 800; font-size: 14px; color: var(--ink-2); }
  .luego summary::-webkit-details-marker { display: none; }
  .luego summary .i:last-child { margin-left: auto; transition: transform .2s; }
  .luego[open] summary .i:last-child { transform: rotate(90deg); }
  .luego div { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .luego div b { font-weight: 700; }
  .luego div span { color: var(--ink-3); font-weight: 700; white-space: nowrap; }
  .encuesta { border: 0; box-shadow: 0 0 0 1.5px #c9dcfb, var(--sh-2); background: linear-gradient(180deg, #f1f6ff, #fff 70%); }
  .encuesta.hecha { box-shadow: 0 0 0 1.5px #b6ebca, var(--sh-1); background: linear-gradient(180deg, #ecfbf2, #fff 80%); }
  .encuesta.hecha .burbuja { background: var(--lima-2); color: #fff; }
  .encuesta .pregunta { font-weight: 700; font-size: 15px; margin-bottom: 12px; }
  .notas { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 4px; }
  .notas button { aspect-ratio: 1; min-height: 34px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; font-weight: 800; font-size: 14px; cursor: pointer; transition: all .15s; padding: 0; }
  .notas button:hover { border-color: var(--blue); color: var(--blue); }
  .notas button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; transform: scale(1.08); box-shadow: var(--sh-azul); }
  .extremos { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
  @media (max-width: 400px) { .notas { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .num .antes-ahora { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--ink-3); }
  .num .antes-ahora .chip { font-size: 11.5px; padding: 2px 8px; }
  .esperando { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-radius: 14px; background: var(--surface-2); font-size: 13.5px; font-weight: 700; color: var(--ink-2); margin-top: 10px; }
  .esperando .i { color: var(--lima-2); }
  .esperando span { flex: 1; }
  .todo-ok { font-size: 15px; font-weight: 700; color: var(--ink); }
  .todo-ok small { display: block; font-size: 13px; color: var(--ink-2); font-weight: 600; margin-top: 2px; }

  .ver-hechos { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; margin-bottom: 14px; border-radius: 14px; border: 1px dashed #bfe7ce; background: #f3fcf6; color: var(--lima-2); font-weight: 800; font-size: 13.5px; cursor: pointer; text-align: left; }
  .ver-hechos .i:last-child { margin-left: auto; }

  /* ---------- videos ---------- */
  .carrusel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 18px 10px; margin: 0 -18px; scrollbar-width: none; }
  .carrusel::-webkit-scrollbar { display: none; }
  .vid { position: relative; flex: none; width: 146px; aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; scroll-snap-align: start; border: 0; padding: 0; cursor: pointer; color: #fff; text-align: left; transition: transform .25s var(--ease), box-shadow .25s; box-shadow: 0 12px 26px -14px rgba(5, 29, 71, .7);
    background: radial-gradient(140px 160px at 80% 0%, rgba(92, 165, 255, .35), transparent 70%), linear-gradient(170deg, #12305f, #071a3d); }
  .vid:hover { transform: translateY(-3px); }
  .vid:active { transform: scale(.97); }
  .vid.aprobar { background: radial-gradient(160px 180px at 80% 0%, rgba(140, 200, 255, .6), transparent 70%), linear-gradient(170deg, #2a7cf6, #0b4bb0); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--blue), 0 16px 30px -12px rgba(26, 111, 224, .9); }
  .vid.cambios { background: linear-gradient(170deg, #f7b538, #c86d05); }
  .vid.aprobado { background: radial-gradient(160px 180px at 80% 0%, rgba(150, 255, 190, .45), transparent 70%), linear-gradient(170deg, #1fbf63, #0a7a3a); }
  .vid.publicado { background: radial-gradient(160px 180px at 80% 0%, rgba(49, 217, 109, .35), transparent 70%), linear-gradient(170deg, #0b1530, #050b1c); }
  .vid::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(0, 0, 0, .45)); pointer-events: none; }
  .vid-chip { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1; }
  .vid-chip .chip { background: rgba(255, 255, 255, .92); color: var(--ink); font-size: 11px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .vid-ico { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -62%); width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .3); backdrop-filter: blur(4px); z-index: 1; }
  .vid.aprobar .vid-ico { background: #fff; color: var(--blue); animation: latido 2s infinite; }
  .vid-pie { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 1; }
  .vid-pie b { display: block; font-size: 14px; line-height: 1.2; overflow-wrap: anywhere; }
  .vid-pie small { display: block; font-size: 11.5px; font-weight: 700; color: rgba(255, 255, 255, .78); margin-top: 3px; }
  .vid-dots { display: flex; gap: 3px; margin-top: 8px; }
  .vid-dots i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .25); }

  .billetera { padding: 20px 18px; border-radius: var(--r-lg); color: #fff; box-shadow: var(--sh-2); overflow: hidden; position: relative;

  .saldo-grande small { display: block; font-size: 12.5px; font-weight: 800; color: rgba(255, 255, 255, .7); text-transform: uppercase; letter-spacing: .08em; }

  .saldo-grande span { font-size: 13.5px; color: rgba(255, 255, 255, .8); font-weight: 600; }

  .qr-hoja { display: block; width: 230px; max-width: 100%; margin: 4px auto 14px; border-radius: 18px; border: 1px solid var(--line); background: #fff; padding: 8px; }

  /* ---------- tu asesor ---------- */
  .asesor { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .asesor .avatar { width: 54px; height: 54px; border-radius: 50%; font-size: 18px; }

  .fab { position: fixed; right: 18px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 55; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--wa); color: #fff; box-shadow: 0 14px 30px -8px rgba(34, 192, 99, .8); text-decoration: none; transition: transform .2s var(--ease); }

  .pie { text-align: center; font-size: 12.5px; color: var(--ink-3); font-weight: 700; padding: 6px 0 0; }

  /* ---------- bienvenida (pantalla completa) ---------- */
  .bienv { position: fixed; inset: 0; z-index: 100; overflow: auto; color: #fff; display: grid; place-items: center; padding: 28px 22px;
    background: radial-gradient(700px 420px at 100% 0%, rgba(92, 165, 255, .5), transparent 60%), radial-gradient(500px 360px at 0% 100%, rgba(49, 217, 109, .25), transparent 60%), linear-gradient(160deg, #1a6fe0, #082e6e 70%, #051d47); }
  .bienv-in { width: 100%; max-width: 440px; }
  .bienv .logos { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }

  .bienv h1 { font-family: var(--display); font-size: 40px; line-height: 1; letter-spacing: -.035em; margin-bottom: 14px; }
  .bienv .txt { font-size: 16px; line-height: 1.55; color: rgba(255, 255, 255, .9); }
  .bienv .firma { margin: 14px 0 26px; font-weight: 800; color: var(--lima); }
  .bienv ul { list-style: none; margin: 0 0 30px; padding: 0; display: grid; gap: 12px; }

  @media (max-width: 370px) {
    .hero-motor .trio { width: 124px; }

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="logica.js"></script>
<script src="iconos.js"></script>
<script>
(function () {
  "use strict";
  var ENDPOINT = String(window.PANEL_ENDPOINT || "").trim();
  var P = new URLSearchParams(location.search);
  var C = P.get("c") || "", K = P.get("k") || "", YO = P.get("yo") === "1";
  var S = { d: null, cargado: 0, todasNov: false, verHechos: false };

  // ---------- utilidades ----------
  function $(id) { return document.getElementById(id); }
  function e(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function leer(k) { try { return localStorage.getItem(k); } catch (x) { return null; } }
  function guardar(k, v) { try { localStorage.setItem(k, v); } catch (x) { /* sin almacenamiento */ } }
  var tToast;
  function toast(msg, esError) {
    var t = $("toast"); t.innerHTML = ICO(esError ? "alerta" : "check", 18) + "<span>" + e(msg) + "</span>"; t.classList.toggle("error", !!esError); t.classList.add("ver");
    clearTimeout(tToast); tToast = setTimeout(function () { t.classList.remove("ver"); }, 3200);
  }
  function api(datos) {
    if (!ENDPOINT) return Promise.reject(new Error("sin-endpoint"));
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, 30000);
    return fetch(ENDPOINT, { method: "POST", body: JSON.stringify(datos), signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (r) { clearTimeout(t); return r; }, function (x) { clearTimeout(t); throw x; });
  }
  function copiar(texto, aviso) {
    function ok() { toast(aviso || "Copiado"); }
    function viejo() {
      var a = document.createElement("textarea"); a.value = texto; a.style.position = "fixed"; a.style.opacity = "0";
      document.body.appendChild(a); a.select();
      var r = false; try { r = document.execCommand("copy"); } catch (x) { r = false; }
      document.body.removeChild(a);
      if (r) ok(); else window.prompt("Copia esto:", texto);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok, viejo); else viejo();
  }
  function iniciales(s) { var p = String(s || "?").split(/\s+/).filter(function (w) { return w.length > 1; }); return p.slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join("") || "?"; }
  function yo() { return S.d && S.d.ajustes.nombre ? GB.primerNombre(S.d.ajustes.nombre) : "tu asesor"; }
  function linkWa(texto) { return GB.waLink(S.d.ajustes.whatsapp, texto); }
  function logo(cli, p) { return cli.logo ? '<img src="' + e(cli.logo) + '" alt="">' : e(iniciales(p.negocio)); }
  function retraso(i) { return ' style="animation-delay:' + (i * 70) + 'ms"'; }

  // ---------- hoja que sube ----------
  function hoja(html, alAbrir) {
    cerrarHoja();
    var v = document.createElement("div");
    v.className = "velo"; v.id = "velo";
    v.innerHTML = '<div class="hoja" role="dialog" aria-modal="true"><button class="btn-ico chico cerrar" type="button" data-cerrar aria-label="Cerrar">' + ICO("x", 16) + "</button>" + html + "</div>";
    v.addEventListener("click", function (ev) { if (ev.target === v || ev.target.closest("[data-cerrar]")) cerrarHoja(); });
    document.body.appendChild(v);
    document.body.style.overflow = "hidden";
    if (alAbrir) alAbrir(v);
  }
  function cerrarHoja() { var v = $("velo"); if (v) v.remove(); document.body.style.overflow = ""; }
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") cerrarHoja(); });

  // ---------- cargar ----------
  function errorPagina(tit, txt) {
    $("app").innerHTML = '<div class="card error-pagina aparece">' + ICO("enlace", 34) + "<h1>" + e(tit) + '</h1><p>' + e(txt) + "</p></div>";
  }
  function cargar(silencioso) {
    if (!C || !K) { errorPagina("Este link está incompleto", "Pide el link completo a quien maneja tu campaña."); return Promise.resolve(); }
    if (!silencioso) $("app").innerHTML = '<div class="hero" style="min-height:330px"><div class="hero-in"><div class="hero-top"><span class="marca"><i>G</i>Grow Business</span></div></div></div>' +
      '<div class="cuerpo"><div class="esq" style="height:180px"></div><div class="esq" style="height:300px"></div><div class="esq" style="height:240px"></div></div>';
    return api({ accion: "ver", c: C, k: K }).then(function (res) {
      if (!res.ok) {
        if (res.error === "clave" || res.error === "no-existe") return errorPagina("Este link ya no funciona", "Pide el link nuevo a quien maneja tu campaña.");
        throw new Error(res.error || "servidor");
      }
      var primera = !S.d;
      S.d = res; S.cargado = Date.now();
      pintar(primera);
      if (primera && !YO) api({ accion: "visto", c: C, k: K }).catch(function () {});
    }).catch(function (x) {
      if (silencioso) return;
      errorPagina("No se pudo cargar", x && x.message === "sin-endpoint" ? "Falta configurar la dirección del panel." : "Revisa tu internet y vuelve a abrir el link.");
    });
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && S.d && Date.now() - S.cargado > 60000 && !$("velo")) cargar(true);
  });

  // ---------- pintar ----------
  function pintar(primera) {
    var d = S.d, cli = d.cliente, p = cli.proyecto;
    document.title = p.etiqueta + " · " + p.negocio;
    S.anim = primera;
    S.m = GB.motor(p, cli.respuestas, d.hoy, { abierto: true });
    var html = heroHTML() + '<main class="cuerpo">';
    if (YO) html += '<div class="previa aparece">' + ICO("ojo", 18) + "Vista previa: así lo ve tu cliente. Lo que toques aquí no se guarda.</div>";
    if (cli.estado === "pausado") html += '<div class="previa aparece">' + ICO("reloj", 18) + e(p.etiqueta) + " está en pausa por ahora.</div>";
    var bloques = [encuestaHTML(), tocaHTML(), garantiaHTML(), maquinaHTML(), videosHTML(), novedadesHTML(), resultadosHTML(), planHTML(), pagosHTML(), asesorHTML()].filter(Boolean);
    html += bloques.map(function (b, i) { return primera ? b.replace('class="', 'style="animation-delay:' + (120 + i * 80) + 'ms" class="aparece ') : b; }).join("");
    html += '<p class="pie">' + e(d.ajustes.marca) + (d.ajustes.nombre ? " · " + e(d.ajustes.nombre) : "") + "</p></main>";
    if (d.ajustes.whatsapp) html += '<a class="fab" href="' + e(linkWa(saludoWa())) + '" target="_blank" rel="noopener" aria-label="Escríbeme por WhatsApp">' + ICO("whatsapp", 28) + "</a>";
    html += miniHTML();
    var y = window.scrollY;
    $("app").innerHTML = html;
    window.scrollTo(0, y);
    animarGB($("app"), !primera);
    vigilarHero();
    if (primera && !leer("gb_bienv_" + cli.id) && p.bienvenida) mostrarBienvenida();
  }
  function saludoWa() { var p = S.d.cliente.proyecto; return "Hola " + yo() + ", te escribo por " + GB.minus(p.etiqueta) + " de " + p.negocio + ": "; }

  function heroHTML() {
    var d = S.d, cli = d.cliente, p = cli.proyecto, hoy = d.hoy, m = S.m;
    var x = m.actual >= 0 ? m.pasos[m.actual] : null, cur = x ? x.paso : null;
    var estado = m.terminado ? "listo" : x && x.estado === "trabado" ? "trabado" : "girando";
    var ap = function (ms) { return S.anim ? ' aparece" style="animation-delay:' + ms + 'ms' : ""; };
    var h = '<header class="hero" id="hero"><div class="hero-in">' +
      '<div class="hero-top"><span class="marca"><i>' + e(d.ajustes.marca.charAt(0)) + "</i>" + e(d.ajustes.marca) + '</span><button class="btn-ico vidrio" type="button" data-accion="actualizar" aria-label="Actualizar">' + ICO("recargar", 18) + "</button></div>" +
      '<div class="hero-cliente' + ap(0) + '"><div class="avatar">' + logo(cli, p) + "</div><div><small>" + e(p.etiqueta) + "</small><h1>" + e(p.negocio) + "</h1></div></div>" +
      '<div class="hero-motor' + ap(80) + '">' + trio(estado, cur ? icoPaso(cur.nombre) : "trofeo") + '<div class="hero-txt">';
    if (!m.pasos.length) h += '<small>Empezamos</small><p class="ahora">Estamos armando tu camino</p>';
    else if (cur) h += "<small>Estamos en</small><p class=\"ahora\">" + e(cur.nombre) + '</p><div class="hero-chips"><span class="chip vidrio">Paso ' + (m.actual + 1) + " de " + m.pasos.length + "</span>" + (cur.fecha ? '<span class="chip vidrio">' + ICO(cur.fecha < hoy ? "reloj" : "calendario", 13) + (cur.fecha < hoy ? "Lo estoy terminando" : e(GB.cap(GB.cuando(cur.fecha, hoy)))) + "</span>" : "") + "</div>";
    else if (m.terminado) h += '<small>Llegamos</small><p class="ahora">¡Todo listo!</p><div class="hero-chips"><span class="chip vidrio">Mira tus resultados</span></div>';
    else h += '<small>Casi listo</small><p class="ahora">Mi parte está hecha</p><div class="hero-chips"><span class="chip vidrio">Falta un poquito de tu lado</span></div>';
    h += "</div></div>";

    if (a === "pagar") { hojaPagar(); return; }
    if (a === "copiar-pago") { copiar(S.d.ajustes.pagoTexto, "Datos copiados"); return; }
    if (a === "copiar-texto") { var vt = buscar(p.videos, id); if (vt) copiar(vt.texto, "Texto copiado: pégalo al publicar"); return; }
    if (a === "ya-hice") {
      var t = buscar(p.tareas, id); if (!t) return;
      pedirNota("¿Ya está: " + GB.minus(t.nombre) + "?", "Lo marco como hecho y " + yo() + " lo confirma.", "¿Algo que quieras contarle? (opcional)", false, "Sí, ya lo hice", function (n) {
        responder("tarea", id, true, n, "Hola " + yo() + ", ya está: " + GB.minus(t.nombre) + "." + (n ? " " + n : ""));
      });
      return;
    }
    if (a === "deshacer-tarea") { responder("tarea", id, false, ""); return; }
    if (a === "aprobar") {
      var v = buscar(p.videos, id); if (!v) return;
      hoja('<div style="text-align:center;padding-top:6px"><span class="burbuja" style="width:64px;height:64px;border-radius:50%;display:inline-grid;place-items:center;background:var(--lima-soft);color:var(--lima-2);margin-bottom:12px">' + ICO("check", 30) + "</span>" +
        "<h3>¿Apruebas «" + e(v.titulo) + "»?</h3><p class=\"sub\">Con tu ok, lo publico" + (v.fechaPub ? " " + e(GB.cuando(v.fechaPub, S.d.hoy)) : "") + ".</p></div>" +
        '<div class="acc"><button class="btn suave" type="button" data-cerrar>Todavía no</button><button class="btn exito" type="button" id="si-aprobar">Sí, lo apruebo</button></div>', function () {
        $("si-aprobar").addEventListener("click", function () { this.disabled = true; responder("video", id, "aprobado", "", "Hola " + yo() + ", ya aprobé el video «" + v.titulo + "»."); });
      });
      return;
    }
    if (a === "cambios") {
      var vc = buscar(p.videos, id); if (!vc) return;
      pedirNota("¿Qué cambiamos en «" + vc.titulo + "»?", "Dime qué quieres distinto. Lo corrijo y te mando la nueva versión.", "El cambio", true, "Enviar", function (n) {
        responder("video", id, "cambios", n, "Hola " + yo() + ", te pedí un cambio en «" + vc.titulo + "»: " + n);
      });
      return;
    }
    if (a === "ya-pague") {
      var x = buscar(p.pagos, id); if (!x) return;
      pedirNota("¿Ya pagaste " + GB.bs(x.monto) + " Bs?", yo() + " lo revisa y lo confirma.", "¿Cómo pagaste? (opcional: QR, transferencia, efectivo)", false, "Sí, ya pagué", function (n) {
        responder("pago", id, true, n, "Hola " + yo() + ", ya pagué " + GB.bs(x.monto) + " Bs (" + GB.minus(x.concepto) + ")." + (n ? " " + n : ""));
      });
    }
  });

  cargar();
})();
</script>
</body>
</html>
